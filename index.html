function App() {
  const [view, setView] = React.useState('home');
  const [pin, setPin] = React.useState(null);
  const [game, setGame] = React.useState(null);
  const [playerId, setPlayerId] = React.useState(null);
  const [playerName, setPlayerName] = React.useState('');
  const [pinInput, setPinInput] = React.useState('');
  const [nameInput, setNameInput] = React.useState('');
  const [error, setError] = React.useState('');

  // Library state
  const [library, setLibrary] = React.useState(() => quizLib.getAll());
  const [searchQuery, setSearchQuery] = React.useState('');
  const [editingQuiz, setEditingQuiz] = React.useState(null); // current quiz being edited
  const [editingQuestion, setEditingQuestion] = React.useState(null); // {qIdx, draft}
  const [showSaved, setShowSaved] = React.useState(false);

  // Player state
  const [selectedAnswer, setSelectedAnswer] = React.useState(null); // for MC/TF
  const [multiSelectedAnswers, setMultiSelectedAnswers] = React.useState([]);
  const [textAnswer, setTextAnswer] = React.useState('');
  const [sortingState, setSortingState] = React.useState({ slots: [], pool: [] });
  const [answerLocked, setAnswerLocked] = React.useState(false);
  const [, setTick] = React.useState(0);

  const lastQuestionIdx = React.useRef(-1);
  const autoEndedRef = React.useRef({});
  const fileInputRef = React.useRef(null);

  // Auto-fill PIN if scanned QR contains ?pin=XXX
  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const urlPin = params.get('pin');
    if (urlPin && /^\d{6}$/.test(urlPin)) {
      setPinInput(urlPin);
      setView('player-join');
    }
  }, []);

  // Real-time Firebase listener
  React.useEffect(() => {
    const liveViews = [
      'host-lobby', 'host-question', 'host-results', 'host-final',
      'player-lobby', 'player-playing', 'player-answered', 'player-result', 'player-final',
    ];
    if (!pin || !liveViews.includes(view)) return;
    const unsubscribe = gameAPI.listen(pin, (g) => {
      if (!g) return;
      setGame(g);
      if (view.startsWith('player-')) {
        if (g.status === 'playing') {
          if (view === 'player-lobby' || lastQuestionIdx.current !== g.currentQuestionIndex) {
            initPlayerForQuestion(g);
            setView('player-playing');
            lastQuestionIdx.current = g.currentQuestionIndex;
          }
        } else if (g.status === 'showing_results' && view !== 'player-result') {
          setView('player-result');
        } else if (g.status === 'finished' && view !== 'player-final') {
          setView('player-final');
        }
      }
    });
    return unsubscribe;
  }, [pin, view]);

  // Timer tick
  React.useEffect(() => {
    if (view !== 'host-question' && view !== 'player-playing') return;
    const t = setInterval(() => setTick(x => x + 1), 250);
    return () => clearInterval(t);
  }, [view]);

  // Auto-end question on timeout
  React.useEffect(() => {
    if (view !== 'host-question' || !game) return;
    const q = game.questions[game.currentQuestionIndex]; if (!q) return;
    const totalSec = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    const elapsed = (Date.now() - game.questionStartedAt) / 1000;
    const key = `${pin}-${game.currentQuestionIndex}`;
    if (elapsed >= totalSec && !autoEndedRef.current[key]) {
      autoEndedRef.current[key] = true;
      handleShowResults();
    }
  });

  // ==================== HELPERS ====================
  const initPlayerForQuestion = (g) => {
    const q = g.questions[g.currentQuestionIndex];
    setSelectedAnswer(null);
    setMultiSelectedAnswers([]);
    setTextAnswer('');
    setAnswerLocked(false);
    if (q?.type === 'sorting') {
      const shuffled = shuffle(q.items.map((item, idx) => ({ item, originalIdx: idx })));
      setSortingState({ slots: q.items.map(() => null), pool: shuffled });
    }
  };

  const refreshLibrary = () => setLibrary(quizLib.getAll());

  const showSavedToast = () => {
    setShowSaved(true);
    setTimeout(() => setShowSaved(false), 1200);
  };

  const goHome = () => {
    setView('home'); setPin(null); setGame(null); setError('');
    setPinInput(''); setNameInput(''); setPlayerId(null); setPlayerName('');
    setSelectedAnswer(null); setMultiSelectedAnswers([]); setTextAnswer('');
    setAnswerLocked(false); setEditingQuiz(null); setEditingQuestion(null);
    lastQuestionIdx.current = -1; autoEndedRef.current = {};
    if (window.location.search) window.history.replaceState({}, '', window.location.pathname);
  };

  // ==================== ADMIN HANDLERS ====================
  const openLibrary = () => { refreshLibrary(); setView('admin-library'); };

  const createNewQuiz = () => {
    const newQuiz = {
      id: genId(),
      title: 'Yeni Quiz',
      questions: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    quizLib.save(newQuiz);
    refreshLibrary();
    setEditingQuiz(newQuiz);
    setView('admin-quiz-edit');
  };

  const editQuiz = (id) => {
    const q = quizLib.getAll().find(x => x.id === id);
    if (!q) return;
    setEditingQuiz(q);
    setView('admin-quiz-edit');
  };

  const deleteQuizFromLib = (id) => {
    if (!window.confirm('Bu quizi silmək istədiyinizdən əminsiniz?')) return;
    quizLib.delete(id); refreshLibrary();
  };

  const duplicateQuizInLib = (id) => {
    quizLib.duplicate(id); refreshLibrary();
  };

  const updateEditingQuiz = (patch) => {
    const updated = { ...editingQuiz, ...patch };
    setEditingQuiz(updated);
    quizLib.save(updated);
    refreshLibrary();
    showSavedToast();
  };

  const addQuestionToQuiz = (type) => {
    const newQ = createQuestion(type);
    setEditingQuestion({ qIdx: -1, draft: newQ });
    setError('');
    setView('admin-question-edit');
  };

  const editQuestionInQuiz = (idx) => {
    const q = editingQuiz.questions[idx];
    setEditingQuestion({ qIdx: idx, draft: JSON.parse(JSON.stringify(q)) });
    setError('');
    setView('admin-question-edit');
  };

  const saveQuestionDraft = () => {
    const err = validateQuestion(editingQuestion.draft);
    if (err) { setError(err); return; }
    const newQs = [...editingQuiz.questions];
    if (editingQuestion.qIdx === -1) newQs.push(editingQuestion.draft);
    else newQs[editingQuestion.qIdx] = editingQuestion.draft;
    updateEditingQuiz({ questions: newQs });
    setEditingQuestion(null);
    setError('');
    setView('admin-quiz-edit');
  };

  const deleteQuestionFromQuiz = (idx) => {
    if (!window.confirm('Bu sualı silmək istəyirsiniz?')) return;
    const newQs = editingQuiz.questions.filter((_, i) => i !== idx);
    updateEditingQuiz({ questions: newQs });
  };

  const startGameFromQuiz = async (quiz) => {
    if (!quiz.questions.length) { alert('Bu quizdə sual yoxdur!'); return; }
    const newPin = genPin();
    const gameData = {
      pin: newPin, title: quiz.title, questions: quiz.questions,
      status: 'lobby', currentQuestionIndex: -1, questionStartedAt: 0,
      players: {}, answers: {}, createdAt: Date.now(),
    };
    const ok = await gameAPI.set(newPin, gameData);
    if (!ok) { alert('Oyun yaradılarkən xəta. Firebase əlaqəsini yoxlayın.'); return; }
    setPin(newPin); setGame(gameData); setView('host-lobby');
  };

  const handleImport = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const count = quizLib.import(ev.target.result);
      if (count === -1) alert('Fayl formatı yanlışdır');
      else { alert(`${count} quiz uğurla idxal edildi!`); refreshLibrary(); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  // ==================== HOST GAME HANDLERS ====================
  const startQuiz = async () => {
    const g = await gameAPI.get(pin); if (!g) return;
    g.status = 'playing'; g.currentQuestionIndex = 0;
    g.questionStartedAt = Date.now(); g.answers = { 0: {} };
    await gameAPI.set(pin, g); setGame(g); setView('host-question');
  };

  const handleShowResults = async () => {
    const g = await gameAPI.get(pin); if (!g || g.status !== 'playing') return;
    g.status = 'showing_results';
    const qIdx = g.currentQuestionIndex;
    const q = g.questions[qIdx];
    const ansForQ = g.answers?.[qIdx] || {};
    Object.keys(g.players || {}).forEach(pid => {
      const a = ansForQ[pid]; if (!a) return;
      const result = scoreAnswer(q, a, a.answeredAt, g.questionStartedAt);
      g.players[pid].score = (g.players[pid].score || 0) + result.points;
      a.correct = result.correct; a.points = result.points; a.correctness = result.correctness;
    });
    if (!g.answers) g.answers = {}; g.answers[qIdx] = ansForQ;
    await gameAPI.set(pin, g); setGame(g); setView('host-results');
  };

  const handleNextQuestion = async () => {
    const g = await gameAPI.get(pin); if (!g) return;
    const next = g.currentQuestionIndex + 1;
    if (next >= g.questions.length) {
      g.status = 'finished';
      await gameAPI.set(pin, g); setGame(g); setView('host-final');
    } else {
      g.currentQuestionIndex = next; g.status = 'playing';
      g.questionStartedAt = Date.now();
      if (!g.answers) g.answers = {}; g.answers[next] = {};
      await gameAPI.set(pin, g); setGame(g); setView('host-question');
    }
  };

  // ==================== PLAYER HANDLERS ====================
  const joinByPin = async () => {
    if (!/^\d{6}$/.test(pinInput)) { setError('PIN 6 rəqəmdən ibarət olmalıdır'); return; }
    const g = await gameAPI.get(pinInput);
    if (!g) { setError('Bu PIN ilə oyun tapılmadı'); return; }
    if (g.status !== 'lobby') { setError('Oyun artıq başlayıb və ya bitib'); return; }
    setPin(pinInput); setGame(g); setError(''); setView('player-name');
  };

  const submitName = async () => {
    if (!nameInput.trim()) { setError('Ad daxil edin'); return; }
    const g = await gameAPI.get(pin);
    if (!g) { setError('Oyun tapılmadı'); goHome(); return; }
    if (Object.values(g.players || {}).some(p => p.name === nameInput.trim())) {
      setError('Bu ad artıq götürülüb'); return;
    }
    const newId = genId();
    if (!g.players) g.players = {};
    g.players[newId] = { name: nameInput.trim(), score: 0, joinedAt: Date.now() };
    await gameAPI.set(pin, g);
    setPlayerId(newId); setPlayerName(nameInput.trim()); setError(''); setView('player-lobby');
  };

  const submitAnswerValue = async (value) => {
    if (answerLocked) return;
    setAnswerLocked(true);
    const g = await gameAPI.get(pin); if (!g) return;
    const qIdx = g.currentQuestionIndex;
    if (!g.answers) g.answers = {};
    if (!g.answers[qIdx]) g.answers[qIdx] = {};
    g.answers[qIdx][playerId] = { value, answeredAt: Date.now() };
    await gameAPI.set(pin, g);
    setView('player-answered');
  };

  // ==================== COMPUTED ====================
  const getTimeLeft = () => {
    if (!game || game.currentQuestionIndex < 0) return 0;
    const q = game.questions[game.currentQuestionIndex];
    const total = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    return Math.max(0, Math.ceil(total - (Date.now() - game.questionStartedAt) / 1000));
  };
  const getTimePercent = () => {
    if (!game || game.currentQuestionIndex < 0) return 0;
    const q = game.questions[game.currentQuestionIndex];
    const total = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    return Math.max(0, Math.min(100, ((total - (Date.now() - game.questionStartedAt) / 1000) / total) * 100));
  };
  const getAnsweredCount = () => game?.currentQuestionIndex < 0 ? 0 : Object.keys(game?.answers?.[game?.currentQuestionIndex] || {}).length;
  const getLeaderboard = () => game?.players ? Object.entries(game.players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.score || 0) - (a.score || 0)) : [];
  const formatTime = (val, unit) => unit === 'minutes' ? `${val} dəq` : `${val} san`;

  // =====================================================================
  // RENDER
  // =====================================================================
  if (!FIREBASE_OK) return <FirebaseWarning />;

  // ---- HOME ----
  if (view === 'home') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 flex items-center justify-center p-4">
        <div className="max-w-2xl w-full">
          <div className="text-center mb-12">
            <div className="inline-flex items-center justify-center w-24 h-24 bg-white rounded-3xl shadow-2xl mb-6 rotate-3"><I.Sparkles size={48} className="text-purple-600" /></div>
            <h1 className="text-6xl font-black text-white mb-3 tracking-tight drop-shadow-lg">QuizLive!</h1>
            <p className="text-xl text-purple-100 font-medium">Real vaxt rejimində interaktiv təlim quiz platforması</p>
          </div>
          <div className="grid md:grid-cols-2 gap-5">
            <button onClick={openLibrary} className="group bg-white rounded-3xl p-8 shadow-2xl hover:shadow-purple-500/50 transition-all hover:-translate-y-2 text-left">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-14 h-14 bg-purple-100 rounded-2xl flex items-center justify-center group-hover:bg-purple-600 transition-colors"><I.Shield size={32} className="text-purple-600 group-hover:text-white transition-colors" /></div>
                <h2 className="text-2xl font-black text-gray-900">Admin</h2>
              </div>
              <p className="text-gray-600 mb-4">Quiz kitabxanasını idarə et, sual əlavə et, oyunu başlat.</p>
              <div className="flex items-center gap-2 text-purple-600 font-bold">Quiz kitabxanası <I.Arrow size={16} /></div>
            </button>
            <button onClick={() => { setView('player-join'); setError(''); setPinInput(''); }} className="group bg-white rounded-3xl p-8 shadow-2xl hover:shadow-pink-500/50 transition-all hover:-translate-y-2 text-left">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-14 h-14 bg-pink-100 rounded-2xl flex items-center justify-center group-hover:bg-pink-600 transition-colors"><I.Phone size={32} className="text-pink-600 group-hover:text-white transition-colors" /></div>
                <h2 className="text-2xl font-black text-gray-900">İştirakçı</h2>
              </div>
              <p className="text-gray-600 mb-4">PIN kod ilə oyuna qoşul və sualları cavablandır.</p>
              <div className="flex items-center gap-2 text-pink-600 font-bold">Oyuna qoşul <I.Arrow size={16} /></div>
            </button>
          </div>
          <p className="text-center text-purple-200 mt-10 text-sm">Eyni vaxtda bir neçə cihazdan qoşulmaq olar</p>
        </div>
      </div>
    );
  }

  // ---- ADMIN: QUIZ LIBRARY ----
  if (view === 'admin-library') {
    const filtered = library.filter(q => q.title.toLowerCase().includes(searchQuery.toLowerCase()));
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <input ref={fileInputRef} type="file" accept=".json" onChange={handleImport} className="hidden" />
        <div className="max-w-5xl mx-auto">
          <div className="flex items-center justify-between mb-6">
            <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-colors"><I.Home size={20} /> Ana səhifə</button>
            <div className="flex items-center gap-2 text-white"><I.Library size={20} /><span className="font-bold">Quiz Kitabxanası</span></div>
          </div>

          <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
            <div className="flex flex-col sm:flex-row gap-3 mb-4">
              <div className="flex-1 relative">
                <I.Search size={20} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Quiz axtar..."
                  className="w-full pl-11 pr-4 py-3 bg-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-purple-500" />
              </div>
              <button onClick={createNewQuiz} className="bg-gradient-to-r from-purple-600 to-fuchsia-600 hover:from-purple-700 hover:to-fuchsia-700 text-white font-bold rounded-xl px-6 py-3 flex items-center justify-center gap-2 shadow-lg">
                <I.Plus size={20} /> Yeni Quiz
              </button>
            </div>
            <div className="flex flex-wrap gap-2 text-sm">
              <button onClick={() => quizLib.exportAll()} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg px-3 py-1.5 flex items-center gap-1"><I.Download size={14} /> Yedək al</button>
              <button onClick={() => fileInputRef.current?.click()} className="bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg px-3 py-1.5 flex items-center gap-1"><I.Upload size={14} /> Yedəkdən bərpa et</button>
              <span className="text-gray-500 ml-auto py-1.5">Cəmi: <b>{library.length}</b> quiz</span>
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="bg-white/10 backdrop-blur border-2 border-dashed border-white/30 rounded-3xl p-12 text-center text-white">
              <I.Library size={64} className="mx-auto mb-4 opacity-50" />
              <p className="text-xl font-bold mb-2">{library.length === 0 ? 'Hələ heç bir quiz yoxdur' : 'Axtarışa uyğun nəticə yoxdur'}</p>
              {library.length === 0 && <button onClick={createNewQuiz} className="mt-4 bg-white text-purple-700 font-bold px-6 py-3 rounded-xl">İlk quizi yarat</button>}
            </div>
          ) : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {filtered.map(q => (
                <div key={q.id} className="bg-white rounded-2xl shadow-lg p-5 hover:shadow-2xl transition-shadow flex flex-col">
                  <h3 className="font-black text-gray-900 mb-2 text-lg break-words line-clamp-2">{q.title}</h3>
                  <div className="text-sm text-gray-500 mb-3">
                    <div className="flex items-center gap-1"><I.Target size={14} /> {q.questions.length} sual</div>
                    <div className="flex items-center gap-1 mt-1"><I.Clock size={14} /> {new Date(q.updatedAt).toLocaleDateString('az-AZ')}</div>
                  </div>
                  <div className="flex gap-1 mb-3 flex-wrap">
                    {[...new Set(q.questions.map(x => x.type))].slice(0, 4).map(t => (
                      <span key={t} className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md font-semibold">{QUESTION_TYPES[t]?.icon} {QUESTION_TYPES[t]?.short}</span>
                    ))}
                  </div>
                  <div className="flex gap-2 mt-auto">
                    <button onClick={() => startGameFromQuiz(q)} disabled={!q.questions.length} className="flex-1 bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-300 text-white font-bold rounded-xl py-2 text-sm flex items-center justify-center gap-1"><I.Play size={14} /> Başlat</button>
                    <button onClick={() => editQuiz(q.id)} className="bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-xl p-2"><I.Edit size={16} /></button>
                    <button onClick={() => duplicateQuizInLib(q.id)} className="bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl p-2"><I.Copy size={16} /></button>
                    <button onClick={() => deleteQuizFromLib(q.id)} className="bg-red-50 hover:bg-red-100 text-red-600 rounded-xl p-2"><I.Trash size={16} /></button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---- ADMIN: QUIZ EDIT (questions list) ----
  if (view === 'admin-quiz-edit' && editingQuiz) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        {showSaved && (
          <div className="fixed top-4 right-4 z-50 bg-emerald-500 text-white px-4 py-2 rounded-xl shadow-2xl font-bold flex items-center gap-2 animate-fade-in">
            <I.Check size={18} /> Saxlanıldı
          </div>
        )}
        <div className="max-w-4xl mx-auto">
          <div className="flex items-center justify-between mb-6">
            <button onClick={openLibrary} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-colors"><I.Left size={20} /> Kitabxana</button>
          </div>

          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <label className="block text-sm font-bold text-gray-500 mb-2 uppercase tracking-wider">Quiz Adı</label>
            <input type="text" value={editingQuiz.title} onChange={(e) => updateEditingQuiz({ title: e.target.value })}
              className="w-full text-3xl font-black text-gray-900 border-b-4 border-purple-200 focus:border-purple-600 outline-none pb-2 transition-colors" />
            <div className="flex items-center gap-4 mt-4 text-sm text-gray-600">
              <span className="flex items-center gap-1"><I.Target size={16} /> {editingQuiz.questions.length} sual</span>
              <span className="flex items-center gap-1"><I.Timer size={16} /> {editingQuiz.questions.reduce((s, q) => s + (q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue), 0)} saniyə</span>
            </div>
          </div>

          <div className="space-y-3 mb-6">
            {editingQuiz.questions.map((q, idx) => (
              <div key={q.id} className="bg-white rounded-2xl shadow-lg p-5">
                <div className="flex items-start gap-4">
                  <div className="w-10 h-10 bg-purple-600 text-white rounded-xl flex items-center justify-center font-black flex-shrink-0">{idx + 1}</div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md font-bold">{QUESTION_TYPES[q.type]?.icon} {QUESTION_TYPES[q.type]?.short}</span>
                      <span className="text-xs text-gray-500 flex items-center gap-1"><I.Clock size={12} /> {formatTime(q.timeValue, q.timeUnit)}</span>
                    </div>
                    <h3 className="font-bold text-gray-900 break-words">{q.text || <em className="text-gray-400">(boş sual)</em>}</h3>
                  </div>
                  <div className="flex flex-col gap-1">
                    <button onClick={() => editQuestionInQuiz(idx)} className="p-2 hover:bg-purple-100 rounded-lg"><I.Edit size={16} className="text-purple-600" /></button>
                    <button onClick={() => deleteQuestionFromQuiz(idx)} className="p-2 hover:bg-red-100 rounded-lg"><I.Trash size={16} className="text-red-600" /></button>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
            <h3 className="font-black text-gray-900 mb-3">Yeni sual əlavə et:</h3>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
              {Object.entries(QUESTION_TYPES).map(([key, type]) => (
                <button key={key} onClick={() => addQuestionToQuiz(key)} className="bg-purple-50 hover:bg-purple-100 border-2 border-purple-200 hover:border-purple-400 rounded-xl p-4 text-center transition-all">
                  <div className="text-3xl mb-1">{type.icon}</div>
                  <div className="text-xs font-bold text-purple-900 leading-tight">{type.short}</div>
                </button>
              ))}
            </div>
          </div>

          <button onClick={() => startGameFromQuiz(editingQuiz)} disabled={editingQuiz.questions.length === 0}
            className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed text-white font-black text-xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.02] flex items-center justify-center gap-3">
            <I.Play size={24} /> Bu quizi indi başlat
          </button>
        </div>
      </div>
    );
  }

  // ---- ADMIN: QUESTION EDIT (type-specific) ----
  if (view === 'admin-question-edit' && editingQuestion) {
    const d = editingQuestion.draft;
    const updateDraft = (patch) => setEditingQuestion({ ...editingQuestion, draft: { ...d, ...patch } });
    const switchType = (newType) => setEditingQuestion({ ...editingQuestion, draft: { ...createQuestion(newType), id: d.id, text: d.text, timeUnit: d.timeUnit, timeValue: d.timeValue } });

    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-3xl mx-auto">
          <button onClick={() => { setView('admin-quiz-edit'); setError(''); setEditingQuestion(null); }} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl mb-6"><I.Left size={20} /> Geri</button>

          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <h2 className="text-2xl font-black text-gray-900 mb-4">{editingQuestion.qIdx === -1 ? 'Yeni sual' : `Sual ${editingQuestion.qIdx + 1}`}</h2>

            <label className="block text-sm font-bold text-gray-700 mb-2">Sual tipi</label>
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-6">
              {Object.entries(QUESTION_TYPES).map(([key, t]) => (
                <button key={key} onClick={() => switchType(key)} className={`rounded-xl p-3 text-center text-xs font-bold transition-all border-2 ${d.type === key ? 'bg-purple-600 text-white border-purple-700 shadow-lg' : 'bg-gray-50 text-gray-700 border-gray-200 hover:border-purple-300'}`}>
                  <div className="text-2xl mb-1">{t.icon}</div>
                  <div className="leading-tight">{t.short}</div>
                </button>
              ))}
            </div>

            <label className="block text-sm font-bold text-gray-700 mb-2">Sual mətni</label>
            <textarea value={d.text} onChange={(e) => updateDraft({ text: e.target.value })} placeholder="Sualınızı yazın..." rows={3}
              className="w-full p-4 text-lg border-2 border-gray-200 rounded-xl focus:border-purple-600 outline-none resize-none mb-6" />

            {/* Type-specific editors */}
            {d.type === 'multiple_choice' && (
              <div className="mb-6">
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-bold text-gray-700">Variantlar (düzgün cavabı seçin)</label>
                  <div className="flex bg-gray-100 rounded-lg p-1 text-sm">
                    {[2,3,4].map(n => (
                      <button key={n} onClick={() => {
                        const opts = [...d.options];
                        while (opts.length < n) opts.push('');
                        opts.length = n;
                        updateDraft({ options: opts, correct: Math.min(d.correct, n-1) });
                      }} className={`px-3 py-1 rounded-md font-bold ${d.options.length === n ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>{n}</button>
                    ))}
                  </div>
                </div>
                <div className="space-y-2">
                  {d.options.map((opt, i) => (
                    <div key={i} className={`flex items-center gap-3 p-3 rounded-xl border-2 ${d.correct === i ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}`}>
                      <button onClick={() => updateDraft({ correct: i })} className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-2xl font-black flex-shrink-0 ${ANSWER_THEMES[i].bg}`}>{ANSWER_THEMES[i].shape}</button>
                      <input type="text" value={opt} onChange={(e) => { const o = [...d.options]; o[i] = e.target.value; updateDraft({ options: o }); }} placeholder={`Variant ${i + 1}`} className="flex-1 outline-none bg-transparent" />
                      <button onClick={() => updateDraft({ correct: i })} className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${d.correct === i ? 'bg-emerald-500 text-white' : 'bg-gray-200'}`}>{d.correct === i ? <I.Check size={18} /> : null}</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {d.type === 'true_false' && (
              <div className="mb-6">
                <label className="block text-sm font-bold text-gray-700 mb-3">Düzgün cavab</label>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => updateDraft({ correct: 0 })} className={`p-6 rounded-2xl text-white font-black text-2xl transition-all ${d.correct === 0 ? 'bg-emerald-500 ring-4 ring-emerald-300 scale-105' : 'bg-gray-300 hover:bg-emerald-400'}`}>✓ Hə</button>
                  <button onClick={() => updateDraft({ correct: 1 })} className={`p-6 rounded-2xl text-white font-black text-2xl transition-all ${d.correct === 1 ? 'bg-rose-500 ring-4 ring-rose-300 scale-105' : 'bg-gray-300 hover:bg-rose-400'}`}>✗ Yox</button>
                </div>
              </div>
            )}

            {d.type === 'multiple_select' && (
              <div className="mb-6">
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-bold text-gray-700">Variantlar (bir neçə düzgün)</label>
                  <div className="flex bg-gray-100 rounded-lg p-1 text-sm">
                    {[2,3,4,5,6].map(n => (
                      <button key={n} onClick={() => {
                        const opts = [...d.options];
                        while (opts.length < n) opts.push('');
                        opts.length = n;
                        updateDraft({ options: opts, correctIndices: (d.correctIndices || []).filter(i => i < n) });
                      }} className={`px-2 py-1 rounded-md font-bold ${d.options.length === n ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>{n}</button>
                    ))}
                  </div>
                </div>
                <div className="space-y-2">
                  {d.options.map((opt, i) => {
                    const isCorrect = d.correctIndices?.includes(i);
                    return (
                      <div key={i} className={`flex items-center gap-3 p-3 rounded-xl border-2 ${isCorrect ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}`}>
                        <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-2xl font-black flex-shrink-0 ${ANSWER_THEMES[i].bg}`}>{ANSWER_THEMES[i].shape}</div>
                        <input type="text" value={opt} onChange={(e) => { const o = [...d.options]; o[i] = e.target.value; updateDraft({ options: o }); }} placeholder={`Variant ${i + 1}`} className="flex-1 outline-none bg-transparent" />
                        <button onClick={() => {
                          const ci = new Set(d.correctIndices || []);
                          if (ci.has(i)) ci.delete(i); else ci.add(i);
                          updateDraft({ correctIndices: [...ci].sort() });
                        }} className={`w-8 h-8 rounded-md flex items-center justify-center flex-shrink-0 border-2 ${isCorrect ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-300'}`}>{isCorrect ? <I.Check size={18} /> : null}</button>
                      </div>
                    );
                  })}
                </div>
                <p className="text-xs text-gray-500 mt-2">İştirakçılar bütün düzgün cavabları seçməlidirlər.</p>
              </div>
            )}

            {d.type === 'type_answer' && (
              <div className="mb-6">
                <label className="block text-sm font-bold text-gray-700 mb-3">Qəbul edilən cavablar</label>
                <p className="text-xs text-gray-500 mb-3">İştirakçının cavabı bu siyahıdan biri ilə uyğun olsa, düzgün hesab olunur (böyük/kiçik hərflər və boşluqlar nəzərə alınmır).</p>
                <div className="space-y-2">
                  {d.acceptableAnswers.map((ans, i) => (
                    <div key={i} className="flex items-center gap-2">
                      <input type="text" value={ans} onChange={(e) => { const a = [...d.acceptableAnswers]; a[i] = e.target.value; updateDraft({ acceptableAnswers: a }); }} placeholder={i === 0 ? 'Əsas düzgün cavab' : `Alternativ ${i}`} className="flex-1 p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-600" />
                      {d.acceptableAnswers.length > 1 && (
                        <button onClick={() => updateDraft({ acceptableAnswers: d.acceptableAnswers.filter((_, j) => j !== i) })} className="p-2 text-red-600 hover:bg-red-50 rounded-lg"><I.Trash size={18} /></button>
                      )}
                    </div>
                  ))}
                </div>
                <button onClick={() => updateDraft({ acceptableAnswers: [...d.acceptableAnswers, ''] })} className="mt-2 text-purple-600 font-semibold text-sm flex items-center gap-1"><I.Plus size={16} /> Alternativ cavab əlavə et</button>
              </div>
            )}

            {d.type === 'sorting' && (
              <div className="mb-6">
                <div className="flex items-center justify-between mb-3">
                  <label className="text-sm font-bold text-gray-700">Elementlər (düzgün ardıcıllıqla)</label>
                  <div className="flex bg-gray-100 rounded-lg p-1 text-sm">
                    {[3,4,5,6].map(n => (
                      <button key={n} onClick={() => {
                        const items = [...d.items];
                        while (items.length < n) items.push('');
                        items.length = n;
                        updateDraft({ items });
                      }} className={`px-2 py-1 rounded-md font-bold ${d.items.length === n ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>{n}</button>
                    ))}
                  </div>
                </div>
                <p className="text-xs text-gray-500 mb-3">İştirakçılar elementləri qarışıq görəcək və düzgün ardıcıllıqla sıralayacaqlar.</p>
                <div className="space-y-2">
                  {d.items.map((item, i) => (
                    <div key={i} className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 text-white rounded-xl flex items-center justify-center font-black flex-shrink-0">{i + 1}</div>
                      <input type="text" value={item} onChange={(e) => { const it = [...d.items]; it[i] = e.target.value; updateDraft({ items: it }); }} placeholder={`Sırada ${i + 1}-ci element`} className="flex-1 p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-purple-600" />
                      <div className="flex flex-col gap-1">
                        <button onClick={() => { if (i === 0) return; const it = [...d.items]; [it[i-1], it[i]] = [it[i], it[i-1]]; updateDraft({ items: it }); }} disabled={i === 0} className="px-2 py-0.5 bg-gray-100 hover:bg-gray-200 disabled:opacity-30 rounded text-xs">▲</button>
                        <button onClick={() => { if (i === d.items.length - 1) return; const it = [...d.items]; [it[i+1], it[i]] = [it[i], it[i+1]]; updateDraft({ items: it }); }} disabled={i === d.items.length - 1} className="px-2 py-0.5 bg-gray-100 hover:bg-gray-200 disabled:opacity-30 rounded text-xs">▼</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Time settings */}
            <label className="block text-sm font-bold text-gray-700 mb-3">Cavab vaxtı</label>
            <div className="flex gap-3 mb-3">
              <input type="number" min={1} value={d.timeValue} onChange={(e) => updateDraft({ timeValue: parseInt(e.target.value) || 0 })}
                className="flex-1 p-4 text-lg border-2 border-gray-200 rounded-xl outline-none focus:border-purple-600" />
              <div className="flex bg-gray-100 rounded-xl p-1">
                <button onClick={() => updateDraft({ timeUnit: 'seconds' })} className={`px-5 py-2 rounded-lg font-bold ${d.timeUnit === 'seconds' ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>San</button>
                <button onClick={() => updateDraft({ timeUnit: 'minutes' })} className={`px-5 py-2 rounded-lg font-bold ${d.timeUnit === 'minutes' ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>Dəq</button>
              </div>
            </div>
            <div className="flex flex-wrap gap-2">
              {[10, 20, 30, 60].map(s => (<button key={s} onClick={() => updateDraft({ timeValue: s, timeUnit: 'seconds' })} className="px-3 py-1.5 bg-gray-100 hover:bg-purple-100 hover:text-purple-700 rounded-lg text-sm font-semibold">{s}s</button>))}
              {[1, 2, 5].map(m => (<button key={`m${m}`} onClick={() => updateDraft({ timeValue: m, timeUnit: 'minutes' })} className="px-3 py-1.5 bg-gray-100 hover:bg-purple-100 hover:text-purple-700 rounded-lg text-sm font-semibold">{m}dəq</button>))}
            </div>
          </div>

          {error && <div className="bg-red-500 text-white rounded-xl p-4 mb-4 flex items-center gap-2"><I.Alert size={20} /> {error}</div>}
          <div className="flex gap-3">
            <button onClick={() => { setView('admin-quiz-edit'); setError(''); setEditingQuestion(null); }} className="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur text-white font-bold rounded-2xl py-4">Ləğv</button>
            <button onClick={saveQuestionDraft} className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl py-4 shadow-xl">Yadda saxla</button>
          </div>
        </div>
      </div>
    );
  }

  // ---- HOST: LOBBY ----
  if (view === 'host-lobby' && game) {
    const players = Object.entries(game.players || {});
    const playerUrl = `${window.location.origin}${window.location.pathname}?pin=${pin}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(playerUrl)}&color=7c3aed&bgcolor=ffffff&margin=10`;
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-6xl mx-auto">
          <div className="flex items-center justify-between mb-6">
            <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl"><I.Home size={20} /> Ana səhifə</button>
            <h2 className="text-white font-bold text-lg truncate ml-4">{game.title}</h2>
          </div>
          <div className="grid md:grid-cols-2 gap-6 mb-6">
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 text-center">
              <p className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Qoşulmaq üçün PIN:</p>
              <div className="text-7xl sm:text-8xl font-black text-purple-600 tracking-wider mb-4 select-all">{pin}</div>
              <div className="bg-gray-50 rounded-2xl p-4 inline-block"><img src={qrUrl} alt="QR" className="w-48 h-48 mx-auto" /></div>
              <p className="text-sm text-gray-500 mt-3">QR skan et və ya saytda PIN-i daxil et</p>
              <p className="text-xs text-gray-400 mt-1 break-all">{playerUrl}</p>
            </div>
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-2xl font-black text-gray-900 flex items-center gap-2"><I.Users size={28} className="text-purple-600" /> İştirakçılar</h3>
                <span className="bg-purple-600 text-white px-4 py-1 rounded-full font-black text-xl">{players.length}</span>
              </div>
              {players.length === 0 ? (
                <div className="text-center py-12 text-gray-400"><I.Users size={64} className="mx-auto mb-3 opacity-30" /><p>İştirakçıları gözləyirik...</p></div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-80 overflow-y-auto">
                  {players.map(([id, p]) => (<div key={id} className="bg-gradient-to-br from-purple-100 to-pink-100 text-purple-900 rounded-xl px-3 py-2 font-bold text-center text-sm truncate animate-fade-in">{p.name}</div>))}
                </div>
              )}
            </div>
          </div>
          <button onClick={startQuiz} disabled={players.length === 0}
            className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed text-white font-black text-2xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.01] flex items-center justify-center gap-3">
            <I.Play size={28} /> {players.length === 0 ? 'İştirakçı gözlənilir...' : `Oyunu başlat (${players.length} iştirakçı)`}
          </button>
        </div>
      </div>
    );
  }

  // ---- HOST: QUESTION ----
  if (view === 'host-question' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const timeLeft = getTimeLeft();
    const timePct = getTimePercent();
    const answered = getAnsweredCount();
    const total = Object.keys(game.players || {}).length;
    const ansForQ = game.answers?.[game.currentQuestionIndex] || {};
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-6xl mx-auto">
          <div className="flex items-center justify-between mb-4 text-white flex-wrap gap-2">
            <span className="bg-white/20 backdrop-blur rounded-xl px-4 py-2 font-bold text-sm">Sual {game.currentQuestionIndex + 1} / {game.questions.length}</span>
            <span className="bg-white/20 backdrop-blur rounded-xl px-3 py-2 font-bold text-sm flex items-center gap-1">{QUESTION_TYPES[q.type]?.icon} {QUESTION_TYPES[q.type]?.short}</span>
            <span className="bg-white/20 backdrop-blur rounded-xl px-4 py-2 font-bold text-sm flex items-center gap-2"><I.Users size={16} /> {answered} / {total}</span>
          </div>
          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 mb-6">
            <h2 className="text-2xl sm:text-4xl font-black text-gray-900 text-center mb-8 leading-tight">{q.text}</h2>
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 rounded-full bg-purple-600 text-white flex items-center justify-center text-2xl font-black flex-shrink-0">{timeLeft}</div>
              <div className="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500 transition-all duration-200" style={{ width: `${timePct}%` }} />
              </div>
            </div>
          </div>

          {/* Answer display by type */}
          {(q.type === 'multiple_choice' || q.type === 'multiple_select') && (
            <div className="grid sm:grid-cols-2 gap-3 mb-6">
              {q.options.map((opt, i) => (
                <div key={i} className={`${ANSWER_THEMES[i].bg} text-white rounded-2xl p-5 sm:p-6 shadow-xl flex items-center gap-3`}>
                  <span className="text-3xl sm:text-4xl flex-shrink-0">{ANSWER_THEMES[i].shape}</span>
                  <span className="font-bold text-lg sm:text-xl break-words">{opt}</span>
                </div>
              ))}
            </div>
          )}

          {q.type === 'true_false' && (
            <div className="grid grid-cols-2 gap-3 mb-6">
              <div className="bg-emerald-500 text-white rounded-2xl p-8 shadow-xl text-center"><div className="text-6xl mb-2">✓</div><div className="font-black text-3xl">Hə</div></div>
              <div className="bg-rose-500 text-white rounded-2xl p-8 shadow-xl text-center"><div className="text-6xl mb-2">✗</div><div className="font-black text-3xl">Yox</div></div>
            </div>
          )}

          {q.type === 'type_answer' && (
            <div className="bg-white/20 backdrop-blur rounded-2xl p-8 mb-6 text-center text-white">
              <I.Edit size={48} className="mx-auto mb-3 opacity-80" />
              <p className="text-xl font-bold">İştirakçılar cavabı yazırlar...</p>
            </div>
          )}

          {q.type === 'sorting' && (
            <div className="bg-white rounded-2xl p-6 mb-6">
              <p className="font-bold text-gray-700 mb-3">Düzgün ardıcıllıq:</p>
              <div className="space-y-2">
                {q.items.map((item, i) => (
                  <div key={i} className="flex items-center gap-3 bg-purple-50 rounded-xl p-3">
                    <div className="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center font-black text-sm">{i + 1}</div>
                    <span className="font-bold text-gray-900">{item}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="bg-white/20 backdrop-blur rounded-2xl p-4 mb-6">
            <p className="text-white font-bold mb-3">Cavab verənlər:</p>
            <div className="flex flex-wrap gap-2">
              {Object.entries(game.players || {}).map(([pid, p]) => {
                const a = ansForQ[pid];
                return (<div key={pid} className={`px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1 ${a ? 'bg-emerald-500 text-white' : 'bg-white/40 text-white'}`}>{p.name} {a && <I.Check size={12} />}</div>);
              })}
            </div>
          </div>

          <button onClick={handleShowResults} className="w-full bg-white text-purple-700 font-black text-xl rounded-2xl py-4 shadow-2xl hover:scale-[1.01] transition-transform flex items-center justify-center gap-2"><I.Right size={24} /> Nəticələri göstər</button>
        </div>
      </div>
    );
  }

  // ---- HOST: RESULTS ----
  if (view === 'host-results' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const ansForQ = game.answers?.[game.currentQuestionIndex] || {};
    let correctCount = 0, wrongCount = 0, noAnswerCount = 0;
    Object.entries(game.players || {}).forEach(([pid]) => {
      const a = ansForQ[pid];
      if (!a) noAnswerCount++;
      else if (a.correct) correctCount++;
      else wrongCount++;
    });
    const leaderboard = getLeaderboard();
    const isLast = game.currentQuestionIndex >= game.questions.length - 1;

    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-5xl mx-auto">
          <div className="text-white text-center mb-6">
            <p className="text-sm font-bold opacity-70 mb-1">Sual {game.currentQuestionIndex + 1} nəticələri</p>
            <h2 className="text-2xl sm:text-3xl font-black">{q.text}</h2>
          </div>

          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <div className="grid grid-cols-3 gap-3 mb-6">
              <div className="bg-emerald-50 rounded-2xl p-4 text-center"><I.Check size={32} className="text-emerald-600 mx-auto mb-1" /><div className="text-3xl font-black text-emerald-600">{correctCount}</div><div className="text-sm text-emerald-700 font-bold">Düzgün</div></div>
              <div className="bg-rose-50 rounded-2xl p-4 text-center"><I.X size={32} className="text-rose-600 mx-auto mb-1" /><div className="text-3xl font-black text-rose-600">{wrongCount}</div><div className="text-sm text-rose-700 font-bold">Səhv</div></div>
              <div className="bg-gray-50 rounded-2xl p-4 text-center"><I.Clock size={32} className="text-gray-600 mx-auto mb-1" /><div className="text-3xl font-black text-gray-600">{noAnswerCount}</div><div className="text-sm text-gray-700 font-bold">Cavabsız</div></div>
            </div>

            {/* Type-specific result viz */}
            {(q.type === 'multiple_choice' || q.type === 'true_false') && (
              <div className="space-y-2">
                {q.options.map((opt, i) => {
                  const count = Object.values(ansForQ).filter(a => a.value === i).length;
                  const maxCount = Math.max(...q.options.map((_, j) => Object.values(ansForQ).filter(a => a.value === j).length), 1);
                  const pct = (count / maxCount) * 100;
                  const isCorrect = i === q.correct;
                  const theme = q.type === 'true_false' ? (i === 0 ? { bg: 'bg-emerald-500', shape: '✓' } : { bg: 'bg-rose-500', shape: '✗' }) : ANSWER_THEMES[i];
                  return (
                    <div key={i} className="flex items-center gap-3">
                      <div className={`w-10 h-10 ${theme.bg} text-white rounded-lg flex items-center justify-center text-xl font-black flex-shrink-0`}>{theme.shape}</div>
                      <div className="flex-1 relative h-10 bg-gray-100 rounded-xl overflow-hidden">
                        <div className={`absolute inset-y-0 left-0 ${theme.bg} opacity-80 transition-all duration-700`} style={{ width: `${pct}%` }} />
                        <div className="relative h-full px-3 flex items-center justify-between"><span className="font-bold text-gray-900 truncate">{opt}</span><span className="font-black text-gray-900 ml-2">{count}</span></div>
                      </div>
                      {isCorrect && <div className="w-10 h-10 bg-emerald-500 text-white rounded-full flex items-center justify-center flex-shrink-0"><I.Check size={20} /></div>}
                    </div>
                  );
                })}
              </div>
            )}

            {q.type === 'multiple_select' && (
              <div>
                <p className="font-bold text-gray-700 mb-3">Düzgün cavablar: {q.correctIndices.map(i => q.options[i]).join(', ')}</p>
                <div className="space-y-2">
                  {q.options.map((opt, i) => {
                    const count = Object.values(ansForQ).filter(a => Array.isArray(a.value) && a.value.includes(i)).length;
                    const totalAnswered = Object.values(ansForQ).length || 1;
                    const pct = (count / totalAnswered) * 100;
                    const isCorrect = q.correctIndices?.includes(i);
                    return (
                      <div key={i} className="flex items-center gap-3">
                        <div className={`w-10 h-10 ${ANSWER_THEMES[i].bg} text-white rounded-lg flex items-center justify-center text-xl font-black flex-shrink-0`}>{ANSWER_THEMES[i].shape}</div>
                        <div className="flex-1 relative h-10 bg-gray-100 rounded-xl overflow-hidden">
                          <div className={`absolute inset-y-0 left-0 ${ANSWER_THEMES[i].bg} opacity-80`} style={{ width: `${pct}%` }} />
                          <div className="relative h-full px-3 flex items-center justify-between"><span className="font-bold text-gray-900 truncate">{opt}</span><span className="font-black text-gray-900 ml-2">{count}</span></div>
                        </div>
                        {isCorrect && <div className="w-10 h-10 bg-emerald-500 text-white rounded-full flex items-center justify-center flex-shrink-0"><I.Check size={20} /></div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {q.type === 'type_answer' && (
              <div>
                <p className="font-bold text-gray-700 mb-2">Düzgün cavablar:</p>
                <div className="flex flex-wrap gap-2 mb-4">
                  {q.acceptableAnswers.filter(a => a.trim()).map((a, i) => (<span key={i} className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg font-bold text-sm">{a}</span>))}
                </div>
                <p className="font-bold text-gray-700 mb-2">İştirakçıların cavabları:</p>
                <div className="space-y-1 max-h-60 overflow-y-auto">
                  {Object.entries(ansForQ).map(([pid, a]) => (
                    <div key={pid} className={`flex items-center justify-between p-2 rounded-lg ${a.correct ? 'bg-emerald-50' : 'bg-rose-50'}`}>
                      <span className="font-bold text-gray-700 text-sm">{game.players[pid]?.name}</span>
                      <span className={`text-sm ${a.correct ? 'text-emerald-700' : 'text-rose-700'}`}>"{a.value}"</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {q.type === 'sorting' && (
              <div>
                <p className="font-bold text-gray-700 mb-3">Düzgün ardıcıllıq:</p>
                <div className="space-y-2 mb-4">
                  {q.items.map((item, i) => (<div key={i} className="flex items-center gap-3 bg-emerald-50 rounded-xl p-3"><div className="w-8 h-8 bg-emerald-500 text-white rounded-lg flex items-center justify-center font-black text-sm">{i + 1}</div><span className="font-bold text-gray-900">{item}</span></div>))}
                </div>
                <p className="text-sm text-gray-600">Hər iştirakçı düzgün yerlərə görə qismi xal qazandı.</p>
              </div>
            )}
          </div>

          <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
            <h3 className="text-xl font-black text-gray-900 mb-4 flex items-center gap-2"><I.Trophy size={24} className="text-amber-500" /> Lider lövhəsi</h3>
            <div className="space-y-2">
              {leaderboard.slice(0, 5).map((p, idx) => {
                const a = ansForQ[p.id];
                return (
                  <div key={p.id} className={`flex items-center gap-3 p-3 rounded-xl ${idx === 0 ? 'bg-amber-50' : 'bg-gray-50'}`}>
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-white flex-shrink-0 text-sm ${idx === 0 ? 'bg-amber-500' : idx === 1 ? 'bg-gray-400' : idx === 2 ? 'bg-orange-400' : 'bg-gray-300'}`}>{idx + 1}</div>
                    <span className="flex-1 font-bold text-gray-900 truncate">{p.name}</span>
                    {a && <span className={`text-xs font-bold px-2 py-1 rounded ${a.correct ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>{a.correct ? `+${a.points}` : 'səhv'}</span>}
                    <span className="font-black text-purple-600">{p.score || 0}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <button onClick={handleNextQuestion} className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-black text-xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.01] flex items-center justify-center gap-2">
            {isLast ? <><I.Trophy size={24} /> Yekun nəticə</> : <>Növbəti sual <I.Right size={24} /></>}
          </button>
        </div>
      </div>
    );
  }

  // ---- HOST: FINAL ----
  if (view === 'host-final' && game) {
    const leaderboard = getLeaderboard();
    const top3 = leaderboard.slice(0, 3);
    const rest = leaderboard.slice(3);
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-4xl mx-auto">
          <div className="text-center mb-8">
            <I.Trophy size={80} className="text-amber-300 mx-auto mb-3" />
            <h1 className="text-5xl font-black text-white mb-2">Oyun Bitdi!</h1>
            <p className="text-purple-100 text-lg">{game.title}</p>
          </div>
          {top3.length > 0 && (
            <div className="grid grid-cols-3 gap-3 mb-6">
              {[1, 0, 2].map((position) => {
                const p = top3[position]; if (!p) return <div key={position} />;
                const heights = [180, 220, 150];
                const colors = ['from-gray-300 to-gray-400', 'from-amber-400 to-amber-500', 'from-orange-400 to-orange-500'];
                const medals = ['🥈', '🥇', '🥉'];
                return (
                  <div key={p.id} className="flex flex-col items-center justify-end">
                    <div className="text-center mb-2"><div className="text-4xl mb-1">{medals[position]}</div><div className="font-black text-white truncate max-w-[120px]">{p.name}</div><div className="text-amber-200 font-black text-2xl">{p.score || 0}</div></div>
                    <div className={`w-full bg-gradient-to-b ${colors[position]} rounded-t-2xl flex items-start justify-center pt-3`} style={{ height: heights[position] }}><I.Crown size={32} className="text-white" /></div>
                  </div>
                );
              })}
            </div>
          )}
          {rest.length > 0 && (
            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
              <h3 className="font-black text-gray-900 mb-3">Digər iştirakçılar</h3>
              <div className="space-y-2">
                {rest.map((p, idx) => (
                  <div key={p.id} className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <div className="w-8 h-8 bg-gray-300 text-white rounded-full flex items-center justify-center font-black text-sm">{idx + 4}</div>
                    <span className="flex-1 font-bold text-gray-900 truncate">{p.name}</span>
                    <span className="font-black text-purple-600">{p.score || 0}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={goHome} className="w-full bg-white text-purple-700 font-black text-xl rounded-2xl py-4 shadow-2xl hover:scale-[1.01] transition-transform flex items-center justify-center gap-2"><I.Home size={24} /> Ana səhifəyə qayıt</button>
        </div>
      </div>
    );
  }

  // ---- PLAYER: JOIN ----
  if (view === 'player-join') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full">
          <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl mb-6"><I.Left size={20} /> Geri</button>
          <div className="bg-white rounded-3xl shadow-2xl p-8">
            <div className="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center mb-4"><I.LogIn size={36} className="text-pink-600" /></div>
            <h2 className="text-3xl font-black text-gray-900 mb-2">Oyuna qoşul</h2>
            <p className="text-gray-600 mb-6">Hostdan PIN kodu daxil edin</p>
            <input type="text" value={pinInput} onChange={(e) => setPinInput(e.target.value.replace(/\D/g, '').slice(0, 6))}
              onKeyDown={(e) => e.key === 'Enter' && joinByPin()} placeholder="123456" maxLength={6} inputMode="numeric"
              className="w-full text-center text-5xl font-black tracking-[0.3em] py-5 border-4 border-gray-200 rounded-2xl focus:border-pink-600 outline-none mb-4" />
            {error && <div className="bg-red-50 text-red-700 rounded-xl p-3 mb-4 flex items-center gap-2 text-sm"><I.Alert size={16} /> {error}</div>}
            <button onClick={joinByPin} disabled={pinInput.length !== 6} className="w-full bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-600 hover:to-fuchsia-700 disabled:from-gray-300 disabled:to-gray-400 text-white font-black text-lg rounded-2xl py-4 shadow-xl">Davam et</button>
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: NAME ----
  if (view === 'player-name') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-8">
            <div className="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center mb-4"><I.UserAdd size={36} className="text-pink-600" /></div>
            <h2 className="text-3xl font-black text-gray-900 mb-2">Adın nədir?</h2>
            <p className="text-gray-600 mb-6">{game?.title} oyununa xoş gəldin</p>
            <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value.slice(0, 24))}
              onKeyDown={(e) => e.key === 'Enter' && submitName()} placeholder="Adını yaz..." maxLength={24} autoFocus
              className="w-full text-center text-2xl font-bold py-4 border-4 border-gray-200 rounded-2xl focus:border-pink-600 outline-none mb-4" />
            {error && <div className="bg-red-50 text-red-700 rounded-xl p-3 mb-4 flex items-center gap-2 text-sm"><I.Alert size={16} /> {error}</div>}
            <button onClick={submitName} disabled={!nameInput.trim()} className="w-full bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-600 hover:to-fuchsia-700 disabled:from-gray-300 disabled:to-gray-400 text-white font-black text-lg rounded-2xl py-4 shadow-xl">Oyuna keç</button>
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: LOBBY ----
  if (view === 'player-lobby' && game) {
    const playerCount = Object.keys(game.players || {}).length;
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full text-center text-white">
          <div className="inline-flex items-center justify-center w-20 h-20 bg-white/20 backdrop-blur rounded-3xl mb-6 animate-pulse"><I.Sparkles size={40} /></div>
          <p className="text-xl mb-2 opacity-90">Salam,</p>
          <h2 className="text-5xl font-black mb-8 break-words">{playerName}!</h2>
          <div className="bg-white/20 backdrop-blur rounded-2xl p-6 mb-6"><p className="text-base opacity-90 mb-1">Oyun:</p><p className="text-2xl font-bold mb-4 truncate">{game.title}</p><div className="flex items-center justify-center gap-2"><I.Users size={20} /><span className="font-bold">{playerCount} iştirakçı</span></div></div>
          <div className="flex items-center justify-center gap-2 text-lg"><div className="w-2 h-2 bg-white rounded-full animate-pulse" /><p>Hostun başlatmasını gözləyirik...</p></div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: PLAYING (type-specific UI) ----
  if (view === 'player-playing' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const timeLeft = getTimeLeft();
    const timePct = getTimePercent();

    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex flex-col">
        <div className="max-w-2xl w-full mx-auto flex flex-col flex-1">
          <div className="flex items-center justify-between text-white mb-3 flex-wrap gap-2">
            <span className="bg-white/20 backdrop-blur rounded-xl px-3 py-1 text-sm font-bold">Sual {game.currentQuestionIndex + 1} / {game.questions.length}</span>
            <span className="bg-white/20 backdrop-blur rounded-xl px-3 py-1 text-sm font-bold flex items-center gap-1"><I.Timer size={14} /> {timeLeft}s</span>
          </div>
          <div className="h-2 bg-white/20 rounded-full overflow-hidden mb-4">
            <div className="h-full bg-white transition-all duration-200" style={{ width: `${timePct}%` }} />
          </div>
          <div className="bg-white rounded-2xl shadow-xl p-5 mb-4">
            <p className="text-lg sm:text-xl font-bold text-gray-900 text-center">{q.text}</p>
          </div>

          {q.type === 'multiple_choice' && (
            <div className="grid grid-cols-2 gap-3 flex-1">
              {q.options.map((opt, i) => (
                <button key={i} onClick={() => submitAnswerValue(i)} disabled={answerLocked}
                  className={`${ANSWER_THEMES[i].bg} ${ANSWER_THEMES[i].hover} text-white rounded-2xl p-5 shadow-xl transition-all flex flex-col items-center justify-center gap-2 ${answerLocked ? 'opacity-50' : 'hover:scale-105 active:scale-95'}`}>
                  <span className="text-4xl">{ANSWER_THEMES[i].shape}</span>
                  <span className="font-bold text-base sm:text-lg break-words text-center">{opt}</span>
                </button>
              ))}
            </div>
          )}

          {q.type === 'true_false' && (
            <div className="grid grid-cols-2 gap-3 flex-1">
              <button onClick={() => submitAnswerValue(0)} disabled={answerLocked} className={`bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl p-8 shadow-xl flex flex-col items-center justify-center gap-3 ${answerLocked ? 'opacity-50' : 'hover:scale-105 active:scale-95'}`}><span className="text-7xl">✓</span><span className="font-black text-3xl">Hə</span></button>
              <button onClick={() => submitAnswerValue(1)} disabled={answerLocked} className={`bg-rose-500 hover:bg-rose-600 text-white rounded-2xl p-8 shadow-xl flex flex-col items-center justify-center gap-3 ${answerLocked ? 'opacity-50' : 'hover:scale-105 active:scale-95'}`}><span className="text-7xl">✗</span><span className="font-black text-3xl">Yox</span></button>
            </div>
          )}

          {q.type === 'multiple_select' && (
            <div className="flex flex-col flex-1">
              <div className="grid grid-cols-2 gap-3 flex-1 mb-3">
                {q.options.map((opt, i) => {
                  const selected = multiSelectedAnswers.includes(i);
                  return (
                    <button key={i} onClick={() => {
                      if (answerLocked) return;
                      setMultiSelectedAnswers(selected ? multiSelectedAnswers.filter(x => x !== i) : [...multiSelectedAnswers, i]);
                    }} disabled={answerLocked}
                      className={`${ANSWER_THEMES[i].bg} ${ANSWER_THEMES[i].hover} text-white rounded-2xl p-4 shadow-xl flex flex-col items-center justify-center gap-2 transition-all ${answerLocked ? 'opacity-50' : ''} ${selected ? 'ring-4 ring-white scale-105' : ''}`}>
                      <span className="text-3xl">{ANSWER_THEMES[i].shape}</span>
                      <span className="font-bold text-sm break-words text-center">{opt}</span>
                      {selected && <I.Check size={20} />}
                    </button>
                  );
                })}
              </div>
              <button onClick={() => submitAnswerValue([...multiSelectedAnswers].sort())} disabled={answerLocked || multiSelectedAnswers.length === 0}
                className="bg-white text-purple-700 font-black text-lg rounded-2xl py-4 shadow-2xl disabled:opacity-50">
                Cavabı təsdiqlə ({multiSelectedAnswers.length} seçildi)
              </button>
            </div>
          )}

          {q.type === 'type_answer' && (
            <div className="flex flex-col flex-1">
              <div className="bg-white rounded-2xl p-5 shadow-xl mb-3 flex-1">
                <I.Edit size={32} className="text-purple-500 mb-3" />
                <input type="text" value={textAnswer} onChange={(e) => setTextAnswer(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && textAnswer.trim() && !answerLocked && submitAnswerValue(textAnswer.trim())}
                  placeholder="Cavabınızı yazın..." disabled={answerLocked} autoFocus
                  className="w-full text-2xl font-bold border-b-4 border-purple-200 focus:border-purple-600 outline-none pb-2" />
              </div>
              <button onClick={() => submitAnswerValue(textAnswer.trim())} disabled={answerLocked || !textAnswer.trim()}
                className="bg-white text-purple-700 font-black text-lg rounded-2xl py-4 shadow-2xl disabled:opacity-50">
                Cavabı göndər
              </button>
            </div>
          )}

          {q.type === 'sorting' && (
            <div className="flex flex-col flex-1">
              <div className="bg-white rounded-2xl p-4 shadow-xl mb-3">
                <p className="text-sm font-bold text-gray-700 mb-2">Sıralama (1-dən {q.items.length}-ə):</p>
                <div className="space-y-2">
                  {sortingState.slots.map((slot, idx) => (
                    <div key={idx} className={`flex items-center gap-2 p-2 rounded-xl border-2 ${slot ? 'bg-purple-100 border-purple-300' : 'bg-gray-50 border-dashed border-gray-300'}`}>
                      <div className="w-8 h-8 bg-purple-600 text-white rounded-lg flex items-center justify-center font-black text-sm">{idx + 1}</div>
                      <span className="flex-1 font-bold text-gray-900">{slot ? slot.item : <span className="text-gray-400 italic">boş</span>}</span>
                      {slot && (
                        <button onClick={() => {
                          if (answerLocked) return;
                          const newSlots = [...sortingState.slots]; newSlots[idx] = null;
                          setSortingState({ slots: newSlots, pool: [...sortingState.pool, slot] });
                        }} className="text-rose-600 p-1"><I.X size={16} /></button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
              {sortingState.pool.length > 0 && (
                <div className="bg-white/20 backdrop-blur rounded-2xl p-3 mb-3">
                  <p className="text-white text-sm font-bold mb-2">Aşağıdan seçin:</p>
                  <div className="flex flex-wrap gap-2">
                    {sortingState.pool.map((p, i) => (
                      <button key={i} onClick={() => {
                        if (answerLocked) return;
                        const slotIdx = sortingState.slots.findIndex(s => s === null);
                        if (slotIdx === -1) return;
                        const newSlots = [...sortingState.slots]; newSlots[slotIdx] = p;
                        const newPool = sortingState.pool.filter((_, j) => j !== i);
                        setSortingState({ slots: newSlots, pool: newPool });
                      }} className="bg-white text-purple-700 font-bold px-4 py-2 rounded-xl shadow-md hover:scale-105 transition-transform">{p.item}</button>
                    ))}
                  </div>
                </div>
              )}
              <button onClick={() => submitAnswerValue(sortingState.slots.map(s => s.item))} disabled={answerLocked || sortingState.slots.some(s => s === null)}
                className="bg-white text-purple-700 font-black text-lg rounded-2xl py-4 shadow-2xl disabled:opacity-50">
                Sıralamanı təsdiqlə
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---- PLAYER: ANSWERED ----
  if (view === 'player-answered' && game) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-purple-600 to-fuchsia-700 p-6 flex items-center justify-center">
        <div className="text-center text-white">
          <I.Check size={96} className="mx-auto mb-6" />
          <h2 className="text-3xl font-black mb-2">Cavab göndərildi!</h2>
          <p className="text-xl opacity-90">Digərlərinin cavablarını gözləyirik...</p>
          <div className="flex justify-center gap-1 mt-6">
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: RESULT ----
  if (view === 'player-result' && game) {
    const qIdx = game.currentQuestionIndex;
    const a = game.answers?.[qIdx]?.[playerId];
    const me = game.players?.[playerId];
    const leaderboard = getLeaderboard();
    const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
    const isCorrect = a?.correct;
    const noAnswer = !a;
    const isPartial = a && a.correctness > 0 && a.correctness < 1;

    return (
      <div className={`min-h-screen p-4 flex items-center justify-center ${noAnswer ? 'bg-gray-700' : isCorrect ? 'bg-gradient-to-br from-emerald-500 to-green-600' : isPartial ? 'bg-gradient-to-br from-amber-500 to-orange-600' : 'bg-gradient-to-br from-rose-500 to-red-600'}`}>
        <div className="max-w-md w-full text-center text-white">
          <div className="mb-6">
            {noAnswer ? <I.Clock size={96} className="mx-auto" /> : isCorrect ? (
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto"><I.Check size={64} className="text-emerald-600" /></div>
            ) : isPartial ? (
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto"><span className="text-5xl">½</span></div>
            ) : (
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto"><I.X size={64} className="text-rose-600" /></div>
            )}
          </div>
          <h2 className="text-5xl font-black mb-2">{noAnswer ? 'Vaxt bitdi!' : isCorrect ? 'Düzgün!' : isPartial ? 'Qismən düz!' : 'Səhv!'}</h2>
          {a && a.points > 0 && <p className="text-2xl font-bold opacity-90 mb-6">+{a.points} xal</p>}
          <div className="bg-white/20 backdrop-blur rounded-2xl p-5 mb-3">
            <p className="text-sm opacity-80 mb-1">Yer</p><p className="text-4xl font-black mb-2">{myRank}.</p>
            <p className="text-sm opacity-80 mb-1">Ümumi xal</p><p className="text-3xl font-black">{me?.score || 0}</p>
          </div>
          <p className="opacity-80 mt-4">Hostun növbəti suala keçməsini gözləyirik...</p>
        </div>
      </div>
    );
  }

  // ---- PLAYER: FINAL ----
  if (view === 'player-final' && game) {
    const leaderboard = getLeaderboard();
    const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
    const me = game.players?.[playerId];
    const isWinner = myRank === 1;
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full text-center text-white">
          {isWinner ? (
            <><I.Crown size={96} className="text-amber-300 mx-auto mb-4 animate-bounce-soft" /><h1 className="text-6xl font-black mb-2">Sən qalibsən! 🎉</h1></>
          ) : (
            <><I.Trophy size={80} className="text-amber-300 mx-auto mb-4" /><h1 className="text-4xl font-black mb-2">Oyun bitdi!</h1></>
          )}
          <div className="bg-white/20 backdrop-blur rounded-3xl p-6 my-6">
            <p className="text-lg opacity-90 mb-1">Yerin:</p><p className="text-7xl font-black mb-3">{myRank}.</p>
            <p className="text-lg opacity-90 mb-1">Ümumi xal:</p><p className="text-4xl font-black">{me?.score || 0}</p>
          </div>
          <button onClick={goHome} className="w-full bg-white text-purple-700 font-black text-lg rounded-2xl py-4 shadow-2xl hover:scale-[1.02] transition-transform">Ana səhifəyə qayıt</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-100">
      <button onClick={goHome} className="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold">Ana səhifəyə qayıt</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
