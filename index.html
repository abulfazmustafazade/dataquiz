const genPin = () => Math.floor(100000 + Math.random() * 900000).toString();
const genId = () => Math.random().toString(36).slice(2, 11);
const normalize = (s) => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');

// Fisher-Yates shuffle
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// =====================================================================
// QUESTION FACTORIES & SCORING
// =====================================================================
const createQuestion = (type) => {
  const base = { id: genId(), type, text: '', timeUnit: 'seconds', timeValue: 20 };
  switch (type) {
    case 'multiple_choice': return { ...base, options: ['', '', '', ''], correct: 0 };
    case 'true_false':      return { ...base, options: ['Hə', 'Yox'], correct: 0 };
    case 'multiple_select': return { ...base, options: ['', '', '', ''], correctIndices: [0] };
    case 'type_answer':     return { ...base, acceptableAnswers: [''] };
    case 'sorting':         return { ...base, items: ['', '', '', ''] };
    default: return { ...base, options: ['', '', '', ''], correct: 0 };
  }
};

const validateQuestion = (q) => {
  if (!q.text?.trim()) return 'Sual mətni boş ola bilməz';
  if (!q.timeValue || q.timeValue <= 0) return 'Vaxt 0-dan böyük olmalıdır';
  switch (q.type) {
    case 'multiple_choice':
      if (q.options.length < 2) return 'Ən azı 2 variant olmalıdır';
      if (q.options.some(o => !o.trim())) return 'Bütün variantları doldurun';
      break;
    case 'true_false':
      // No extra validation needed
      break;
    case 'multiple_select':
      if (q.options.length < 2) return 'Ən azı 2 variant olmalıdır';
      if (q.options.some(o => !o.trim())) return 'Bütün variantları doldurun';
      if (!q.correctIndices?.length) return 'Ən azı bir düzgün cavab seçin';
      break;
    case 'type_answer':
      if (!q.acceptableAnswers?.length || q.acceptableAnswers.every(a => !a.trim())) return 'Ən azı bir düzgün cavab daxil edin';
      break;
    case 'sorting':
      if (q.items.length < 2) return 'Ən azı 2 element olmalıdır';
      if (q.items.some(i => !i.trim())) return 'Bütün elementləri doldurun';
      break;
  }
  return null;
};

// Returns { correct: bool, points: number, correctness: 0..1 }
const scoreAnswer = (question, answer, answeredAt, questionStartedAt) => {
  if (!answer || answer.value === undefined || answer.value === null) return { correct: false, points: 0, correctness: 0 };
  const totalSec = question.timeUnit === 'minutes' ? question.timeValue * 60 : question.timeValue;
  const elapsed = (answeredAt - questionStartedAt) / 1000;
  const speedFactor = Math.max(0, 1 - elapsed / totalSec / 2);
  let correctness = 0;

  switch (question.type) {
    case 'multiple_choice':
    case 'true_false':
      correctness = answer.value === question.correct ? 1 : 0;
      break;
    case 'multiple_select': {
      const correct = [...(question.correctIndices || [])].sort();
      const given = [...(answer.value || [])].sort();
      correctness = (correct.length === given.length && correct.every((v, i) => v === given[i])) ? 1 : 0;
      break;
    }
    case 'type_answer': {
      const givenN = normalize(answer.value);
      correctness = (question.acceptableAnswers || []).some(a => normalize(a) === givenN) ? 1 : 0;
      break;
    }
    case 'sorting': {
      const correct = question.items || [];
      const given = answer.value || [];
      let matches = 0;
      for (let i = 0; i < correct.length; i++) if (given[i] === correct[i]) matches++;
      correctness = correct.length ? matches / correct.length : 0;
      break;
    }
  }

  if (correctness === 0) return { correct: false, points: 0, correctness: 0 };
  const points = Math.round(1000 * correctness * (0.5 + speedFactor * 0.5));
  return { correct: correctness >= 0.5, points, correctness };
};

const QUIZ_LIBRARY_KEY = 'quizlive_library_v1';

const quizLib = {
  getAll: () => {
    try {
      const raw = localStorage.getItem(QUIZ_LIBRARY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch { return []; }
  },
  save: (quiz) => {
    const all = quizLib.getAll();
    const idx = all.findIndex(q => q.id === quiz.id);
    const updated = { ...quiz, updatedAt: Date.now() };
    if (idx >= 0) all[idx] = updated;
    else all.unshift({ ...updated, createdAt: Date.now() });
    localStorage.setItem(QUIZ_LIBRARY_KEY, JSON.stringify(all));
    return updated;
  },
  delete: (id) => {
    const all = quizLib.getAll().filter(q => q.id !== id);
    localStorage.setItem(QUIZ_LIBRARY_KEY, JSON.stringify(all));
  },
  duplicate: (id) => {
    const all = quizLib.getAll();
    const orig = all.find(q => q.id === id);
    if (!orig) return null;
    const copy = {
      ...JSON.parse(JSON.stringify(orig)),
      id: genId(),
      title: orig.title + ' (kopya)',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      questions: orig.questions.map(q => ({ ...q, id: genId() })),
    };
    all.unshift(copy);
    localStorage.setItem(QUIZ_LIBRARY_KEY, JSON.stringify(all));
    return copy;
  },
  exportAll: () => {
    const data = quizLib.getAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `quizlive-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
  import: (jsonText) => {
    try {
      const data = JSON.parse(jsonText);
      if (!Array.isArray(data)) throw new Error('Invalid format');
      const existing = quizLib.getAll();
      const merged = [...data.map(q => ({ ...q, id: q.id || genId() })), ...existing];
      // Deduplicate by id
      const seen = new Set();
      const unique = merged.filter(q => seen.has(q.id) ? false : seen.add(q.id));
      localStorage.setItem(QUIZ_LIBRARY_KEY, JSON.stringify(unique));
      return data.length;
    } catch (e) { return -1; }
  },
};

const gameAPI = {
  get: async (pin) => {
    if (!db) return null;
    try { const s = await db.ref(`games/${pin}`).once('value'); return s.val(); }
    catch (e) { console.error(e); return null; }
  },
  set: async (pin, data) => {
    if (!db) return false;
    try { await db.ref(`games/${pin}`).set(data); return true; }
    catch (e) { console.error(e); return false; }
  },
  listen: (pin, callback) => {
    if (!db) return () => {};
    const ref = db.ref(`games/${pin}`);
    const handler = (s) => callback(s.val());
    ref.on('value', handler);
    return () => ref.off('value', handler);
  },
};
