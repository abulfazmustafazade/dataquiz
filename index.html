const FIREBASE_OK = firebaseConfig.apiKey !== "YOUR_API_KEY_HERE";
let db = null;
if (FIREBASE_OK) {

    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

// =====================================================================
// ICONS (inline SVG - lucide-style)
// =====================================================================
const SVG = ({ children, size = 20, className = '', sw = 2 }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const I = {
  Plus:    (p) => <SVG {...p}><path d="M12 5v14M5 12h14"/></SVG>,
  Trash:   (p) => <SVG {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SVG>,
  Play:    (p) => <SVG {...p}><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></SVG>,
  Users:   (p) => <SVG {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></SVG>,
  Trophy:  (p) => <SVG {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/></SVG>,
  Clock:   (p) => <SVG {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></SVG>,
  Check:   (p) => <SVG {...p} sw={3}><polyline points="20 6 9 17 4 12"/></SVG>,
  X:       (p) => <SVG {...p} sw={3}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></SVG>,
  Home:    (p) => <SVG {...p}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></SVG>,
  Edit:    (p) => <SVG {...p}><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></SVG>,
  Sparkles:(p) => <SVG {...p}><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4"/></SVG>,
  Shield:  (p) => <SVG {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></SVG>,
  Left:    (p) => <SVG {...p}><polyline points="15 18 9 12 15 6"/></SVG>,
  Right:   (p) => <SVG {...p}><polyline points="9 18 15 12 9 6"/></SVG>,
  Alert:   (p) => <SVG {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></SVG>,
  Crown:   (p) => <SVG {...p}><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zM5 20h14"/></SVG>,
  Target:  (p) => <SVG {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></SVG>,
  Timer:   (p) => <SVG {...p}><line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/></SVG>,
  UserAdd: (p) => <SVG {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></SVG>,
  LogIn:   (p) => <SVG {...p}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></SVG>,
  Phone:   (p) => <SVG {...p}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></SVG>,
  Arrow:   (p) => <SVG {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></SVG>,
};

// =====================================================================
// ANSWER THEMES (Kahoot-style colored shapes)
// =====================================================================
const ANSWER_THEMES = [
  { bg: 'bg-rose-500',    hover: 'hover:bg-rose-600',    shape: '▲', name: 'Üçbucaq' },
  { bg: 'bg-sky-500',     hover: 'hover:bg-sky-600',     shape: '◆', name: 'Romb' },
  { bg: 'bg-amber-400',   hover: 'hover:bg-amber-500',   shape: '●', name: 'Dairə' },
  { bg: 'bg-emerald-500', hover: 'hover:bg-emerald-600', shape: '■', name: 'Kvadrat' },
];

const genPin = () => Math.floor(100000 + Math.random() * 900000).toString();
const genId  = () => Math.random().toString(36).slice(2, 11);

// =====================================================================
// FIREBASE STORAGE LAYER
// =====================================================================
const gameAPI = {
  get: async (pin) => {
    if (!db) return null;
    try {
      const snap = await db.ref(`games/${pin}`).once('value');
      return snap.val();
    } catch (e) { console.error(e); return null; }
  },
  set: async (pin, data) => {
    if (!db) return false;
    try { await db.ref(`games/${pin}`).set(data); return true; }
    catch (e) { console.error(e); return false; }
  },
  // Real-time listener — much better than polling
  listen: (pin, callback) => {
    if (!db) return () => {};
    const ref = db.ref(`games/${pin}`);
    const handler = (snap) => callback(snap.val());
    ref.on('value', handler);
    return () => ref.off('value', handler);
  },
};

// =====================================================================
// FIREBASE SETUP WARNING SCREEN
// =====================================================================
const FirebaseSetupWarning = () => (
  <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-6 flex items-center justify-center">
    <div className="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-8">
      <div className="flex items-center gap-3 mb-4">
        <div className="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center">
          <I.Alert size={28} className="text-amber-600" />
        </div>
        <h1 className="text-2xl font-black text-gray-900">Firebase qurulmayıb</h1>
      </div>
      <p className="text-gray-700 mb-4">
        Saytın işləməsi üçün Firebase Realtime Database lazımdır. Aşağıdakı addımları izləyin:
      </p>
      <ol className="space-y-3 text-gray-700 mb-6 list-decimal list-inside">
        <li><a href="https://console.firebase.google.com" target="_blank" className="text-purple-600 font-bold hover:underline">Firebase Console</a>-a daxil olun və yeni layihə yaradın (pulsuzdur)</li>
        <li>Sol menyudan <b>"Realtime Database"</b> seçin və <b>"Create Database"</b>-ə basın</li>
        <li>Region seçin və <b>"Test mode"</b>-da başladın</li>
        <li>Layihə Settings → "General" → "Your apps" → Web tətbiqi əlavə edin</li>
        <li><code className="bg-gray-100 px-2 py-1 rounded">firebaseConfig</code> obyektini kopyalayın və <code className="bg-gray-100 px-2 py-1 rounded">index.html</code>-də əvəz edin</li>
      </ol>
      <div className="bg-purple-50 border-2 border-purple-200 rounded-xl p-4 text-sm text-purple-900">
        <b>Tam təlimat:</b> README.md faylına baxın
      </div>
    </div>
  </div>
);

// =====================================================================
// MAIN APP
// =====================================================================
function App() {
  const [view, setView] = React.useState('home');
  const [pin, setPin] = React.useState(null);
  const [game, setGame] = React.useState(null);
  const [playerId, setPlayerId] = React.useState(null);
  const [playerName, setPlayerName] = React.useState('');
  const [pinInput, setPinInput] = React.useState('');
  const [nameInput, setNameInput] = React.useState('');
  const [error, setError] = React.useState('');

  const [quizTitle, setQuizTitle] = React.useState('Yeni Quiz');
  const [questions, setQuestions] = React.useState([]);
  const [editing, setEditing] = React.useState(null);

  const [selectedAnswer, setSelectedAnswer] = React.useState(null);
  const [answerLocked, setAnswerLocked] = React.useState(false);
  const [, setTick] = React.useState(0);

  const lastQuestionIdx = React.useRef(-1);
  const autoEndedRef = React.useRef({});

  // Auto-fill PIN if scanned QR contains ?pin=XXX
  React.useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const urlPin = params.get('pin');
    if (urlPin && /^\d{6}$/.test(urlPin)) {
      setPinInput(urlPin);
      setView('player-join');
    }
  }, []);

  // Real-time Firebase listener
  React.useEffect(() => {
    const liveViews = [
      'host-lobby', 'host-question', 'host-results', 'host-final',
      'player-lobby', 'player-playing', 'player-answered', 'player-result', 'player-final',
    ];
    if (!pin || !liveViews.includes(view)) return;

    const unsubscribe = gameAPI.listen(pin, (g) => {
      if (!g) return;
      setGame(g);

      // Player auto-transitions
      if (view.startsWith('player-')) {
        if (g.status === 'playing') {
          if (view === 'player-lobby' || lastQuestionIdx.current !== g.currentQuestionIndex) {
            setView('player-playing');
            setSelectedAnswer(null);
            setAnswerLocked(false);
            lastQuestionIdx.current = g.currentQuestionIndex;
          }
        } else if (g.status === 'showing_results' && view !== 'player-result') {
          setView('player-result');
        } else if (g.status === 'finished' && view !== 'player-final') {
          setView('player-final');
        }
      }
    });

    return unsubscribe;
  }, [pin, view]);

  // Timer tick for live countdown rendering
  React.useEffect(() => {
    if (view !== 'host-question' && view !== 'player-playing') return;
    const t = setInterval(() => setTick(x => x + 1), 250);
    return () => clearInterval(t);
  }, [view]);

  // Auto-end question when timer hits 0 (host only)
  React.useEffect(() => {
    if (view !== 'host-question' || !game) return;
    const q = game.questions[game.currentQuestionIndex];
    if (!q) return;
    const totalSec = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    const elapsed = (Date.now() - game.questionStartedAt) / 1000;
    const key = `${pin}-${game.currentQuestionIndex}`;
    if (elapsed >= totalSec && !autoEndedRef.current[key]) {
      autoEndedRef.current[key] = true;
      handleShowResults();
    }
  });

  // ============= HANDLERS =============
  const goHome = () => {
    setView('home'); setPin(null); setGame(null); setError('');
    setPinInput(''); setNameInput(''); setPlayerId(null); setPlayerName('');
    setSelectedAnswer(null); setAnswerLocked(false);
    lastQuestionIdx.current = -1; autoEndedRef.current = {};
    if (window.location.search) window.history.replaceState({}, '', window.location.pathname);
  };

  const startAdminFlow = () => {
    setQuizTitle('Yeni Quiz');
    setQuestions([{
      id: genId(),
      text: 'Azərbaycanın paytaxtı hansı şəhərdir?',
      options: ['Bakı', 'Gəncə', 'Sumqayıt', 'Şəki'],
      correct: 0, timeUnit: 'seconds', timeValue: 20,
    }]);
    setView('admin-list');
  };

  const addNewQuestion = () => {
    setEditing({ index: -1, draft: { id: genId(), text: '', options: ['','','',''], correct: 0, timeUnit: 'seconds', timeValue: 20 } });
    setError(''); setView('admin-edit');
  };
  const editQuestion = (idx) => {
    setEditing({ index: idx, draft: { ...questions[idx], options: [...questions[idx].options] } });
    setError(''); setView('admin-edit');
  };
  const saveQuestionDraft = () => {
    const d = editing.draft;
    if (!d.text.trim()) { setError('Sual mətni boş ola bilməz'); return; }
    if (d.options.some(o => !o.trim())) { setError('Bütün cavab variantları doldurulmalıdır'); return; }
    if (!d.timeValue || d.timeValue <= 0) { setError('Vaxt 0-dan böyük olmalıdır'); return; }
    setError('');
    const newQs = [...questions];
    if (editing.index === -1) newQs.push(d); else newQs[editing.index] = d;
    setQuestions(newQs); setEditing(null); setView('admin-list');
  };
  const deleteQuestion = (idx) => setQuestions(questions.filter((_, i) => i !== idx));

  const startGame = async () => {
    if (questions.length === 0) { setError('Ən azı bir sual əlavə edin'); return; }
    const newPin = genPin();
    const gameData = {
      pin: newPin, title: quizTitle, questions,
      status: 'lobby', currentQuestionIndex: -1, questionStartedAt: 0,
      players: {}, answers: {}, createdAt: Date.now(),
    };
    const ok = await gameAPI.set(newPin, gameData);
    if (!ok) { setError('Oyun yaradılarkən xəta baş verdi. Firebase əlaqəsini yoxlayın.'); return; }
    setPin(newPin); setGame(gameData); setError(''); setView('host-lobby');
  };

  const startQuiz = async () => {
    const g = await gameAPI.get(pin); if (!g) return;
    g.status = 'playing'; g.currentQuestionIndex = 0;
    g.questionStartedAt = Date.now(); g.answers = { 0: {} };
    await gameAPI.set(pin, g); setGame(g); setView('host-question');
  };

  const handleShowResults = async () => {
    const g = await gameAPI.get(pin); if (!g || g.status !== 'playing') return;
    g.status = 'showing_results';
    const qIdx = g.currentQuestionIndex;
    const q = g.questions[qIdx];
    const ansForQ = g.answers?.[qIdx] || {};
    Object.keys(g.players || {}).forEach(pid => {
      const a = ansForQ[pid];
      if (a && a.answer === q.correct) {
        const totalSec = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
        const elapsed = (a.answeredAt - g.questionStartedAt) / 1000;
        const speedFactor = Math.max(0, 1 - elapsed / totalSec / 2);
        const points = Math.round(1000 * (0.5 + speedFactor * 0.5));
        g.players[pid].score = (g.players[pid].score || 0) + points;
        a.correct = true; a.points = points;
      } else if (a) { a.correct = false; a.points = 0; }
    });
    if (!g.answers) g.answers = {}; g.answers[qIdx] = ansForQ;
    await gameAPI.set(pin, g); setGame(g); setView('host-results');
  };

  const handleNextQuestion = async () => {
    const g = await gameAPI.get(pin); if (!g) return;
    const next = g.currentQuestionIndex + 1;
    if (next >= g.questions.length) {
      g.status = 'finished';
      await gameAPI.set(pin, g); setGame(g); setView('host-final');
    } else {
      g.currentQuestionIndex = next; g.status = 'playing';
      g.questionStartedAt = Date.now();
      if (!g.answers) g.answers = {}; g.answers[next] = {};
      await gameAPI.set(pin, g); setGame(g); setView('host-question');
    }
  };

  const joinByPin = async () => {
    if (!/^\d{6}$/.test(pinInput)) { setError('PIN 6 rəqəmdən ibarət olmalıdır'); return; }
    const g = await gameAPI.get(pinInput);
    if (!g) { setError('Bu PIN ilə oyun tapılmadı'); return; }
    if (g.status !== 'lobby') { setError('Oyun artıq başlayıb və ya bitib'); return; }
    setPin(pinInput); setGame(g); setError(''); setView('player-name');
  };

  const submitName = async () => {
    if (!nameInput.trim()) { setError('Ad daxil edin'); return; }
    const g = await gameAPI.get(pin);
    if (!g) { setError('Oyun tapılmadı'); goHome(); return; }
    if (Object.values(g.players || {}).some(p => p.name === nameInput.trim())) {
      setError('Bu ad artıq götürülüb, başqa ad seçin'); return;
    }
    const newId = genId();
    if (!g.players) g.players = {};
    g.players[newId] = { name: nameInput.trim(), score: 0, joinedAt: Date.now() };
    await gameAPI.set(pin, g);
    setPlayerId(newId); setPlayerName(nameInput.trim()); setError(''); setView('player-lobby');
  };

  const submitAnswer = async (idx) => {
    if (answerLocked) return;
    setSelectedAnswer(idx); setAnswerLocked(true);
    const g = await gameAPI.get(pin); if (!g) return;
    const qIdx = g.currentQuestionIndex;
    if (!g.answers) g.answers = {};
    if (!g.answers[qIdx]) g.answers[qIdx] = {};
    g.answers[qIdx][playerId] = { answer: idx, answeredAt: Date.now() };
    await gameAPI.set(pin, g); setView('player-answered');
  };

  // ============= COMPUTED HELPERS =============
  const getTimeLeft = () => {
    if (!game || game.currentQuestionIndex < 0) return 0;
    const q = game.questions[game.currentQuestionIndex];
    const total = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    return Math.max(0, Math.ceil(total - (Date.now() - game.questionStartedAt) / 1000));
  };
  const getTimePercent = () => {
    if (!game || game.currentQuestionIndex < 0) return 0;
    const q = game.questions[game.currentQuestionIndex];
    const total = q.timeUnit === 'minutes' ? q.timeValue * 60 : q.timeValue;
    return Math.max(0, Math.min(100, ((total - (Date.now() - game.questionStartedAt) / 1000) / total) * 100));
  };
  const getAnsweredCount = () => {
    if (!game || game.currentQuestionIndex < 0) return 0;
    return Object.keys(game.answers?.[game.currentQuestionIndex] || {}).length;
  };
  const getLeaderboard = () => {
    if (!game || !game.players) return [];
    return Object.entries(game.players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.score || 0) - (a.score || 0));
  };
  const formatTime = (val, unit) => unit === 'minutes' ? `${val} dəq` : `${val} san`;

  // =====================================================================
  // VIEWS
  // =====================================================================

  if (!FIREBASE_OK) return <FirebaseSetupWarning />;

  // ---- HOME ----
  if (view === 'home') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 flex items-center justify-center p-4">
        <div className="max-w-2xl w-full">
          <div className="text-center mb-12">
            <div className="inline-flex items-center justify-center w-24 h-24 bg-white rounded-3xl shadow-2xl mb-6 rotate-3">
              <I.Sparkles size={48} className="text-purple-600" />
            </div>
            <h1 className="text-6xl font-black text-white mb-3 tracking-tight drop-shadow-lg">QuizLive!</h1>
            <p className="text-xl text-purple-100 font-medium">Real vaxt rejimində interaktiv təlim quiz platforması</p>

                <div className="w-14 h-14 bg-purple-100 rounded-2xl flex items-center justify-center group-hover:bg-purple-600 transition-colors">
                  <I.Shield size={32} className="text-purple-600 group-hover:text-white transition-colors" />
                </div>
                <h2 className="text-2xl font-black text-gray-900">Admin</h2>

              <p className="text-gray-600 mb-4">Quiz yarat, sualları əlavə et, vaxtı təyin et və oyunu idarə et.</p>

              <p className="text-gray-600 mb-4">PIN kod ilə oyuna qoşul və sualları cavablandır.</p>
              <div className="flex items-center gap-2 text-pink-600 font-bold">Oyuna qoşul <I.Arrow size={16} /></div>
            </button>

          <p className="text-center text-purple-200 mt-10 text-sm">Eyni vaxtda bir neçə cihazdan qoşulmaq olar — məlumatlar real vaxtda sinxronlaşır</p>
        </div>
      </div>
    );
  }

  // ---- ADMIN: LIST ----
  if (view === 'admin-list') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-4xl mx-auto">
          <div className="flex items-center justify-between mb-8">
            <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-colors">
              <I.Home size={20} /> Ana səhifə
            </button>
            <div className="flex items-center gap-2 text-white"><I.Shield size={20} /><span className="font-bold">Admin Panel</span></div>
          </div>
          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <label className="block text-sm font-bold text-gray-500 mb-2 uppercase tracking-wider">Quiz Adı</label>
            <input type="text" value={quizTitle} onChange={(e) => setQuizTitle(e.target.value)}

            <div className="flex items-center gap-4 mt-4 text-sm text-gray-600">
              <span className="flex items-center gap-1"><I.Target size={16} /> {questions.length} sual</span>

            </div>
          </div>
          <div className="space-y-3 mb-6">
            {questions.map((q, idx) => (
              <div key={q.id} className="bg-white rounded-2xl shadow-lg p-5 hover:shadow-xl transition-shadow">
                <div className="flex items-start gap-4">
                  <div className="w-10 h-10 bg-purple-600 text-white rounded-xl flex items-center justify-center font-black flex-shrink-0">{idx + 1}</div>
                  <div className="flex-1 min-w-0">
                    <h3 className="font-bold text-gray-900 mb-2 break-words">{q.text}</h3>
                    <div className="flex flex-wrap gap-2 mb-2">
                      {q.options.map((opt, i) => (
                        <span key={i} className={`text-xs px-2 py-1 rounded-lg font-semibold ${i === q.correct ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-600'}`}>
                          {i === q.correct && '✓ '}{opt}
                        </span>
                      ))}
                    </div>
                    <div className="text-xs text-gray-500 flex items-center gap-1"><I.Clock size={12} /> {formatTime(q.timeValue, q.timeUnit)}</div>
                  </div>
                  <div className="flex flex-col gap-1">
                    <button onClick={() => editQuestion(idx)} className="p-2 hover:bg-purple-100 rounded-lg transition-colors"><I.Edit size={16} className="text-purple-600" /></button>
                    <button onClick={() => deleteQuestion(idx)} className="p-2 hover:bg-red-100 rounded-lg transition-colors"><I.Trash size={16} className="text-red-600" /></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <button onClick={addNewQuestion} className="w-full bg-white/20 hover:bg-white/30 backdrop-blur border-2 border-dashed border-white/50 text-white font-bold rounded-2xl py-5 transition-colors flex items-center justify-center gap-2 mb-6">
            <I.Plus size={20} /> Yeni sual əlavə et
          </button>
          {error && <div className="bg-red-500 text-white rounded-xl p-4 mb-4 flex items-center gap-2"><I.Alert size={20} /> {error}</div>}
          <button onClick={startGame} disabled={questions.length === 0}
            className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed text-white font-black text-xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.02] flex items-center justify-center gap-3">
            <I.Play size={24} /> Oyunu Başlat
          </button>
        </div>
      </div>
    );

  // ---- ADMIN: EDIT ----
  if (view === 'admin-edit' && editing) {
    const d = editing.draft;
    const updateDraft = (patch) => setEditing({ ...editing, draft: { ...d, ...patch } });
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-3xl mx-auto">
          <button onClick={() => { setView('admin-list'); setError(''); }} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl mb-6 transition-colors"><I.Left size={20} /> Geri</button>
          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <h2 className="text-3xl font-black text-gray-900 mb-6">{editing.index === -1 ? 'Yeni sual' : `Sual ${editing.index + 1}`}</h2>
            <label className="block text-sm font-bold text-gray-700 mb-2">Sual mətni</label>
            <textarea value={d.text} onChange={(e) => updateDraft({ text: e.target.value })} placeholder="Sualınızı yazın..." rows={3}
              className="w-full p-4 text-lg border-2 border-gray-200 rounded-xl focus:border-purple-600 outline-none transition-colors resize-none mb-6" />
            <label className="block text-sm font-bold text-gray-700 mb-3">Cavab variantları (düzgün cavabı seçin)</label>
            <div className="space-y-3 mb-6">
              {d.options.map((opt, i) => (
                <div key={i} className={`flex items-center gap-3 p-3 rounded-xl border-2 transition-all ${d.correct === i ? 'border-emerald-500 bg-emerald-50' : 'border-gray-200'}`}>
                  <button onClick={() => updateDraft({ correct: i })} className={`w-12 h-12 rounded-xl flex items-center justify-center text-white text-2xl font-black flex-shrink-0 ${ANSWER_THEMES[i].bg}`}>{ANSWER_THEMES[i].shape}</button>
                  <input type="text" value={opt}
                    onChange={(e) => { const o = [...d.options]; o[i] = e.target.value; updateDraft({ options: o }); }}
                    placeholder={`Variant ${i + 1}`} className="flex-1 text-base outline-none bg-transparent" />
                  <button onClick={() => updateDraft({ correct: i })} className={`w-8 h-8 rounded-full flex items-center justify-center transition-all flex-shrink-0 ${d.correct === i ? 'bg-emerald-500 text-white' : 'bg-gray-200 hover:bg-gray-300'}`} title="Düzgün cavab">
                    {d.correct === i ? <I.Check size={20} /> : null}
                  </button>
                </div>
              ))}
            </div>
            <label className="block text-sm font-bold text-gray-700 mb-3">Cavab vaxtı</label>
            <div className="flex gap-3 mb-4">
              <input type="number" min={1} value={d.timeValue} onChange={(e) => updateDraft({ timeValue: parseInt(e.target.value) || 0 })}
                className="flex-1 p-4 text-lg border-2 border-gray-200 rounded-xl focus:border-purple-600 outline-none" />
              <div className="flex bg-gray-100 rounded-xl p-1">
                <button onClick={() => updateDraft({ timeUnit: 'seconds' })} className={`px-5 py-2 rounded-lg font-bold transition-colors ${d.timeUnit === 'seconds' ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>Saniyə</button>
                <button onClick={() => updateDraft({ timeUnit: 'minutes' })} className={`px-5 py-2 rounded-lg font-bold transition-colors ${d.timeUnit === 'minutes' ? 'bg-white shadow text-purple-600' : 'text-gray-600'}`}>Dəqiqə</button>
              </div>
            </div>
            <div className="flex flex-wrap gap-2">
              {[10, 20, 30, 60].map(s => (<button key={s} onClick={() => updateDraft({ timeValue: s, timeUnit: 'seconds' })} className="px-4 py-2 bg-gray-100 hover:bg-purple-100 hover:text-purple-700 rounded-lg text-sm font-semibold transition-colors">{s} san</button>))}
              {[1, 2, 5].map(m => (<button key={`m${m}`} onClick={() => updateDraft({ timeValue: m, timeUnit: 'minutes' })} className="px-4 py-2 bg-gray-100 hover:bg-purple-100 hover:text-purple-700 rounded-lg text-sm font-semibold transition-colors">{m} dəq</button>))}
            </div>
          </div>
          {error && <div className="bg-red-500 text-white rounded-xl p-4 mb-4 flex items-center gap-2"><I.Alert size={20} /> {error}</div>}
          <div className="flex gap-3">
            <button onClick={() => { setView('admin-list'); setError(''); setEditing(null); }} className="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur text-white font-bold rounded-2xl py-4 transition-colors">Ləğv et</button>
            <button onClick={saveQuestionDraft} className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl py-4 shadow-xl transition-all hover:scale-[1.02]">Yadda saxla</button>
          </div>
        </div>
      </div>
    );
  }

  // ---- HOST: LOBBY ----
  if (view === 'host-lobby' && game) {
    const players = Object.entries(game.players || {});
    const playerUrl = `${window.location.origin}${window.location.pathname}?pin=${pin}`;
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(playerUrl)}&color=7c3aed&bgcolor=ffffff&margin=10`;
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-6xl mx-auto">
          <div className="flex items-center justify-between mb-6">
            <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl transition-colors"><I.Home size={20} /> Ana səhifə</button>
            <h2 className="text-white font-bold text-lg truncate ml-4">{game.title}</h2>
          </div>
          <div className="grid md:grid-cols-2 gap-6 mb-6">
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 text-center">
              <p className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Qoşulmaq üçün</p>
              <p className="text-base text-gray-700 mb-2">PIN kod:</p>
              <div className="text-7xl sm:text-8xl font-black text-purple-600 tracking-wider mb-4 select-all">{pin}</div>
              <div className="bg-gray-50 rounded-2xl p-4 inline-block">
                <img src={qrUrl} alt="QR Code" className="w-48 h-48 mx-auto" />
              </div>
              <p className="text-sm text-gray-500 mt-3">QR kodu skan et və ya sayta gedib PIN-i daxil et</p>
              <p className="text-xs text-gray-400 mt-1 break-all">{playerUrl}</p>
            </div>
            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-2xl font-black text-gray-900 flex items-center gap-2"><I.Users size={28} className="text-purple-600" /> İştirakçılar</h3>
                <span className="bg-purple-600 text-white px-4 py-1 rounded-full font-black text-xl">{players.length}</span>
              </div>
              {players.length === 0 ? (
                <div className="text-center py-12 text-gray-400">
                  <I.Users size={64} className="mx-auto mb-3 opacity-30" />
                  <p>İştirakçıları gözləyirik...</p>
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-80 overflow-y-auto">
                  {players.map(([id, p]) => (
                    <div key={id} className="bg-gradient-to-br from-purple-100 to-pink-100 text-purple-900 rounded-xl px-3 py-2 font-bold text-center text-sm truncate">{p.name}</div>
                  ))}
                </div>
              )}
            </div>
          </div>
          <button onClick={startQuiz} disabled={players.length === 0}
            className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 disabled:from-gray-400 disabled:to-gray-500 disabled:cursor-not-allowed text-white font-black text-2xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.01] flex items-center justify-center gap-3">
            <I.Play size={28} /> {players.length === 0 ? 'İştirakçı gözlənilir...' : `Oyunu başlat (${players.length} iştirakçı)`}
          </button>
        </div>
      </div>
    );
  }

  // ---- HOST: QUESTION ----
  if (view === 'host-question' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const timeLeft = getTimeLeft();
    const timePct = getTimePercent();
    const answered = getAnsweredCount();
    const total = Object.keys(game.players || {}).length;
    const ansForQ = game.answers?.[game.currentQuestionIndex] || {};
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-6xl mx-auto">
          <div className="flex items-center justify-between mb-4 text-white">
            <span className="bg-white/20 backdrop-blur rounded-xl px-4 py-2 font-bold">Sual {game.currentQuestionIndex + 1} / {game.questions.length}</span>
            <span className="bg-white/20 backdrop-blur rounded-xl px-4 py-2 font-bold flex items-center gap-2"><I.Users size={16} /> {answered} / {total} cavabladı</span>
          </div>
          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-10 mb-6">
            <h2 className="text-2xl sm:text-4xl font-black text-gray-900 text-center mb-8 leading-tight">{q.text}</h2>
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 rounded-full bg-purple-600 text-white flex items-center justify-center text-2xl font-black flex-shrink-0">{timeLeft}</div>
              <div className="flex-1 h-4 bg-gray-200 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500 transition-all duration-200" style={{ width: `${timePct}%` }} />
              </div>
            </div>
          </div>
          <div className="grid sm:grid-cols-2 gap-3 mb-6">
            {q.options.map((opt, i) => (
              <div key={i} className={`${ANSWER_THEMES[i].bg} text-white rounded-2xl p-5 sm:p-6 shadow-xl flex items-center gap-3`}>
                <span className="text-3xl sm:text-4xl flex-shrink-0">{ANSWER_THEMES[i].shape}</span>
                <span className="font-bold text-lg sm:text-xl break-words">{opt}</span>
              </div>
            ))}
          </div>
          <div className="bg-white/20 backdrop-blur rounded-2xl p-4 mb-6">
            <p className="text-white font-bold mb-3">Cavab verənlər:</p>
            <div className="flex flex-wrap gap-2">
              {Object.entries(game.players || {}).map(([pid, p]) => {
                const a = ansForQ[pid];
                return (
                  <div key={pid} className={`px-3 py-1 rounded-lg text-sm font-bold flex items-center gap-1 ${a ? 'bg-emerald-500 text-white' : 'bg-white/40 text-white'}`}>
                    {p.name} {a && <I.Check size={12} />}
                  </div>
                );
              })}
            </div>
          </div>
          <button onClick={handleShowResults} className="w-full bg-white text-purple-700 font-black text-xl rounded-2xl py-4 shadow-2xl hover:scale-[1.01] transition-transform flex items-center justify-center gap-2">
            <I.Right size={24} /> Nəticələri göstər
          </button>
        </div>
      </div>
    );
  }

  // ---- HOST: RESULTS ----
  if (view === 'host-results' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const ansForQ = game.answers?.[game.currentQuestionIndex] || {};
    const counts = [0, 0, 0, 0];
    let correctCount = 0, wrongCount = 0, noAnswerCount = 0;
    Object.entries(game.players || {}).forEach(([pid]) => {
      const a = ansForQ[pid];
      if (!a) noAnswerCount++;
      else { counts[a.answer]++; if (a.correct) correctCount++; else wrongCount++; }
    });
    const maxCount = Math.max(...counts, 1);
    const leaderboard = getLeaderboard();
    const isLast = game.currentQuestionIndex >= game.questions.length - 1;
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-5xl mx-auto">
          <div className="text-white text-center mb-6">
            <p className="text-sm font-bold opacity-70 mb-1">Sual {game.currentQuestionIndex + 1} nəticələri</p>
            <h2 className="text-2xl sm:text-3xl font-black">{q.text}</h2>
          </div>
          <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 mb-6">
            <div className="grid grid-cols-3 gap-3 mb-6">
              <div className="bg-emerald-50 rounded-2xl p-4 text-center">
                <I.Check size={32} className="text-emerald-600 mx-auto mb-1" />
                <div className="text-3xl font-black text-emerald-600">{correctCount}</div>
                <div className="text-sm text-emerald-700 font-bold">Düzgün</div>
              </div>
              <div className="bg-rose-50 rounded-2xl p-4 text-center">
                <I.X size={32} className="text-rose-600 mx-auto mb-1" />
                <div className="text-3xl font-black text-rose-600">{wrongCount}</div>
                <div className="text-sm text-rose-700 font-bold">Səhv</div>
              </div>
              <div className="bg-gray-50 rounded-2xl p-4 text-center">
                <I.Clock size={32} className="text-gray-600 mx-auto mb-1" />
                <div className="text-3xl font-black text-gray-600">{noAnswerCount}</div>
                <div className="text-sm text-gray-700 font-bold">Cavabsız</div>
              </div>
            </div>
            <div className="space-y-2">
              {q.options.map((opt, i) => {
                const isCorrect = i === q.correct;
                const pct = (counts[i] / maxCount) * 100;
                return (
                  <div key={i} className="flex items-center gap-3">
                    <div className={`w-10 h-10 ${ANSWER_THEMES[i].bg} text-white rounded-lg flex items-center justify-center text-xl font-black flex-shrink-0`}>{ANSWER_THEMES[i].shape}</div>
                    <div className="flex-1 relative h-10 bg-gray-100 rounded-xl overflow-hidden">
                      <div className={`absolute inset-y-0 left-0 ${ANSWER_THEMES[i].bg} opacity-80 transition-all duration-700`} style={{ width: `${pct}%` }} />
                      <div className="relative h-full px-3 flex items-center justify-between">
                        <span className="font-bold text-gray-900 truncate">{opt}</span>
                        <span className="font-black text-gray-900 ml-2">{counts[i]}</span>
                      </div>
                    </div>
                    {isCorrect && <div className="w-10 h-10 bg-emerald-500 text-white rounded-full flex items-center justify-center flex-shrink-0"><I.Check size={20} /></div>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
            <h3 className="text-xl font-black text-gray-900 mb-4 flex items-center gap-2"><I.Trophy size={24} className="text-amber-500" /> Lider lövhəsi</h3>
            <div className="space-y-2">
              {leaderboard.slice(0, 5).map((p, idx) => {
                const a = ansForQ[p.id];
                return (
                  <div key={p.id} className={`flex items-center gap-3 p-3 rounded-xl ${idx === 0 ? 'bg-amber-50' : 'bg-gray-50'}`}>
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-black text-white flex-shrink-0 text-sm ${idx === 0 ? 'bg-amber-500' : idx === 1 ? 'bg-gray-400' : idx === 2 ? 'bg-orange-400' : 'bg-gray-300'}`}>{idx + 1}</div>
                    <span className="flex-1 font-bold text-gray-900 truncate">{p.name}</span>
                    {a && <span className={`text-xs font-bold px-2 py-1 rounded ${a.correct ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>{a.correct ? `+${a.points}` : 'səhv'}</span>}
                    <span className="font-black text-purple-600">{p.score || 0}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <button onClick={handleNextQuestion} className="w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-black text-xl rounded-2xl py-5 shadow-2xl transition-all hover:scale-[1.01] flex items-center justify-center gap-2">
            {isLast ? <><I.Trophy size={24} /> Yekun nəticəni göstər</> : <>Növbəti sual <I.Right size={24} /></>}
          </button>
        </div>
      </div>
    );
  }

  // ---- HOST: FINAL ----
  if (view === 'host-final' && game) {
    const leaderboard = getLeaderboard();
    const top3 = leaderboard.slice(0, 3);
    const rest = leaderboard.slice(3);
    return (
      <div className="min-h-screen bg-gradient-to-br from-violet-600 via-purple-700 to-fuchsia-700 p-4 sm:p-8">
        <div className="max-w-4xl mx-auto">
          <div className="text-center mb-8">
            <I.Trophy size={80} className="text-amber-300 mx-auto mb-3" />
            <h1 className="text-5xl font-black text-white mb-2">Oyun Bitdi!</h1>
            <p className="text-purple-100 text-lg">{game.title}</p>
          </div>
          {top3.length > 0 && (
            <div className="grid grid-cols-3 gap-3 mb-6">
              {[1, 0, 2].map((position) => {
                const p = top3[position]; if (!p) return <div key={position} />;
                const heights = [180, 220, 150];
                const colors = ['from-gray-300 to-gray-400', 'from-amber-400 to-amber-500', 'from-orange-400 to-orange-500'];
                const medals = ['🥈', '🥇', '🥉'];
                return (
                  <div key={p.id} className="flex flex-col items-center justify-end">
                    <div className="text-center mb-2">
                      <div className="text-4xl mb-1">{medals[position]}</div>
                      <div className="font-black text-white truncate max-w-[120px]">{p.name}</div>
                      <div className="text-amber-200 font-black text-2xl">{p.score || 0}</div>
                    </div>
                    <div className={`w-full bg-gradient-to-b ${colors[position]} rounded-t-2xl flex items-start justify-center pt-3`} style={{ height: heights[position] }}>
                      <I.Crown size={32} className="text-white" />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {rest.length > 0 && (
            <div className="bg-white rounded-3xl shadow-2xl p-6 mb-6">
              <h3 className="font-black text-gray-900 mb-3">Digər iştirakçılar</h3>
              <div className="space-y-2">
                {rest.map((p, idx) => (
                  <div key={p.id} className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <div className="w-8 h-8 bg-gray-300 text-white rounded-full flex items-center justify-center font-black text-sm">{idx + 4}</div>
                    <span className="flex-1 font-bold text-gray-900 truncate">{p.name}</span>
                    <span className="font-black text-purple-600">{p.score || 0}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={goHome} className="w-full bg-white text-purple-700 font-black text-xl rounded-2xl py-4 shadow-2xl hover:scale-[1.01] transition-transform flex items-center justify-center gap-2">
            <I.Home size={24} /> Ana səhifəyə qayıt
          </button>
        </div>
      </div>
    );
  }

  // ---- PLAYER: JOIN ----
  if (view === 'player-join') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full">
          <button onClick={goHome} className="flex items-center gap-2 text-white hover:bg-white/10 px-4 py-2 rounded-xl mb-6 transition-colors"><I.Left size={20} /> Geri</button>
          <div className="bg-white rounded-3xl shadow-2xl p-8">
            <div className="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center mb-4"><I.LogIn size={36} className="text-pink-600" /></div>
            <h2 className="text-3xl font-black text-gray-900 mb-2">Oyuna qoşul</h2>
            <p className="text-gray-600 mb-6">Hostdan PIN kodu daxil edin</p>
            <input type="text" value={pinInput} onChange={(e) => setPinInput(e.target.value.replace(/\D/g, '').slice(0, 6))}
              onKeyDown={(e) => e.key === 'Enter' && joinByPin()} placeholder="123456" maxLength={6} inputMode="numeric"
              className="w-full text-center text-5xl font-black tracking-[0.3em] py-5 border-4 border-gray-200 rounded-2xl focus:border-pink-600 outline-none transition-colors mb-4" />
            {error && <div className="bg-red-50 text-red-700 rounded-xl p-3 mb-4 flex items-center gap-2 text-sm"><I.Alert size={16} /> {error}</div>}
            <button onClick={joinByPin} disabled={pinInput.length !== 6}
              className="w-full bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-600 hover:to-fuchsia-700 disabled:from-gray-300 disabled:to-gray-400 text-white font-black text-lg rounded-2xl py-4 shadow-xl transition-all hover:scale-[1.01]">
              Davam et
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: NAME ----
  if (view === 'player-name') {
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full">
          <div className="bg-white rounded-3xl shadow-2xl p-8">
            <div className="w-16 h-16 bg-pink-100 rounded-2xl flex items-center justify-center mb-4"><I.UserAdd size={36} className="text-pink-600" /></div>
            <h2 className="text-3xl font-black text-gray-900 mb-2">Adın nədir?</h2>
            <p className="text-gray-600 mb-6">{game?.title} oyununa xoş gəldin</p>
            <input type="text" value={nameInput} onChange={(e) => setNameInput(e.target.value.slice(0, 24))}
              onKeyDown={(e) => e.key === 'Enter' && submitName()} placeholder="Adını yaz..." maxLength={24} autoFocus
              className="w-full text-center text-2xl font-bold py-4 border-4 border-gray-200 rounded-2xl focus:border-pink-600 outline-none transition-colors mb-4" />
            {error && <div className="bg-red-50 text-red-700 rounded-xl p-3 mb-4 flex items-center gap-2 text-sm"><I.Alert size={16} /> {error}</div>}
            <button onClick={submitName} disabled={!nameInput.trim()}
              className="w-full bg-gradient-to-r from-pink-500 to-fuchsia-600 hover:from-pink-600 hover:to-fuchsia-700 disabled:from-gray-300 disabled:to-gray-400 text-white font-black text-lg rounded-2xl py-4 shadow-xl transition-all hover:scale-[1.01]">
              Oyuna keç
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: LOBBY ----
  if (view === 'player-lobby' && game) {
    const playerCount = Object.keys(game.players || {}).length;
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full text-center text-white">
          <div className="inline-flex items-center justify-center w-20 h-20 bg-white/20 backdrop-blur rounded-3xl mb-6 animate-pulse"><I.Sparkles size={40} /></div>
          <p className="text-xl mb-2 opacity-90">Salam,</p>
          <h2 className="text-5xl font-black mb-8 break-words">{playerName}!</h2>
          <div className="bg-white/20 backdrop-blur rounded-2xl p-6 mb-6">
            <p className="text-base opacity-90 mb-1">Oyun:</p>
            <p className="text-2xl font-bold mb-4 truncate">{game.title}</p>
            <div className="flex items-center justify-center gap-2"><I.Users size={20} /><span className="font-bold">{playerCount} iştirakçı qoşulub</span></div>
          </div>
          <div className="flex items-center justify-center gap-2 text-lg">
            <div className="w-2 h-2 bg-white rounded-full animate-pulse" />
            <p>Hostun başlatmasını gözləyirik...</p>
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: PLAYING ----
  if (view === 'player-playing' && game) {
    const q = game.questions[game.currentQuestionIndex];
    const timeLeft = getTimeLeft();
    const timePct = getTimePercent();
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex flex-col">
        <div className="max-w-2xl w-full mx-auto flex flex-col flex-1">
          <div className="flex items-center justify-between text-white mb-4">
            <span className="bg-white/20 backdrop-blur rounded-xl px-3 py-1 text-sm font-bold">Sual {game.currentQuestionIndex + 1} / {game.questions.length}</span>
            <span className="bg-white/20 backdrop-blur rounded-xl px-3 py-1 text-sm font-bold flex items-center gap-1"><I.Timer size={16} /> {timeLeft}s</span>
          </div>
          <div className="h-2 bg-white/20 rounded-full overflow-hidden mb-4">
            <div className="h-full bg-white transition-all duration-200" style={{ width: `${timePct}%` }} />
          </div>
          <div className="bg-white rounded-2xl shadow-xl p-5 mb-4">
            <p className="text-lg sm:text-xl font-bold text-gray-900 text-center">{q.text}</p>
          </div>
          <div className="grid grid-cols-2 gap-3 flex-1">
            {q.options.map((opt, i) => (
              <button key={i} onClick={() => submitAnswer(i)} disabled={answerLocked}
                className={`${ANSWER_THEMES[i].bg} ${ANSWER_THEMES[i].hover} text-white rounded-2xl p-5 shadow-xl transition-all flex flex-col items-center justify-center gap-2 ${answerLocked ? 'opacity-50' : 'hover:scale-105 active:scale-95'} ${selectedAnswer === i ? 'ring-4 ring-white' : ''}`}>
                <span className="text-4xl sm:text-5xl">{ANSWER_THEMES[i].shape}</span>
                <span className="font-bold text-base sm:text-lg break-words text-center">{opt}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: ANSWERED ----
  if (view === 'player-answered' && game) {
    const theme = ANSWER_THEMES[selectedAnswer];
    return (
      <div className={`min-h-screen ${theme.bg} p-6 flex items-center justify-center`}>
        <div className="text-center text-white">
          <div className="text-8xl mb-6">{theme.shape}</div>
          <h2 className="text-3xl font-black mb-2">Cavab göndərildi!</h2>
          <p className="text-xl opacity-90">Digərlərinin cavablarını gözləyirik...</p>
          <div className="flex justify-center gap-1 mt-6">
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '0ms' }} />
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '150ms' }} />
            <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{ animationDelay: '300ms' }} />
          </div>
        </div>
      </div>
    );
  }

  // ---- PLAYER: RESULT ----
  if (view === 'player-result' && game) {
    const qIdx = game.currentQuestionIndex;
    const a = game.answers?.[qIdx]?.[playerId];
    const me = game.players?.[playerId];
    const leaderboard = getLeaderboard();
    const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
    const isCorrect = a?.correct;
    const noAnswer = !a;
    return (
      <div className={`min-h-screen p-4 flex items-center justify-center ${noAnswer ? 'bg-gray-700' : isCorrect ? 'bg-gradient-to-br from-emerald-500 to-green-600' : 'bg-gradient-to-br from-rose-500 to-red-600'}`}>
        <div className="max-w-md w-full text-center text-white">
          <div className="mb-6">
            {noAnswer ? (<I.Clock size={96} className="mx-auto" />) : isCorrect ? (
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto"><I.Check size={64} className="text-emerald-600" /></div>
            ) : (
              <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mx-auto"><I.X size={64} className="text-rose-600" /></div>
            )}
          </div>
          <h2 className="text-5xl font-black mb-2">{noAnswer ? 'Vaxt bitdi!' : isCorrect ? 'Düzgün!' : 'Səhv!'}</h2>
          {a && a.correct && <p className="text-2xl font-bold opacity-90 mb-6">+{a.points} xal</p>}
          <div className="bg-white/20 backdrop-blur rounded-2xl p-5 mb-3">
            <p className="text-sm opacity-80 mb-1">Yer</p>
            <p className="text-4xl font-black mb-2">{myRank}.</p>
            <p className="text-sm opacity-80 mb-1">Ümumi xal</p>
            <p className="text-3xl font-black">{me?.score || 0}</p>
          </div>
          <p className="opacity-80 mt-4">Hostun növbəti suala keçməsini gözləyirik...</p>
        </div>
      </div>
    );
  }

  // ---- PLAYER: FINAL ----
  if (view === 'player-final' && game) {
    const leaderboard = getLeaderboard();
    const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
    const me = game.players?.[playerId];
    const isWinner = myRank === 1;
    return (
      <div className="min-h-screen bg-gradient-to-br from-pink-600 via-fuchsia-600 to-purple-700 p-4 flex items-center justify-center">
        <div className="max-w-md w-full text-center text-white">
          {isWinner ? (
            <><I.Crown size={96} className="text-amber-300 mx-auto mb-4 animate-bounce-soft" /><h1 className="text-6xl font-black mb-2">Sən qalibsən! 🎉</h1></>
          ) : (
            <><I.Trophy size={80} className="text-amber-300 mx-auto mb-4" /><h1 className="text-4xl font-black mb-2">Oyun bitdi!</h1></>
          )}
          <div className="bg-white/20 backdrop-blur rounded-3xl p-6 my-6">
            <p className="text-lg opacity-90 mb-1">Yerin:</p>
            <p className="text-7xl font-black mb-3">{myRank}.</p>
            <p className="text-lg opacity-90 mb-1">Ümumi xal:</p>
            <p className="text-4xl font-black">{me?.score || 0}</p>
          </div>
          <button onClick={goHome} className="w-full bg-white text-purple-700 font-black text-lg rounded-2xl py-4 shadow-2xl hover:scale-[1.02] transition-transform">Ana səhifəyə qayıt</button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-gray-100">
      <button onClick={goHome} className="bg-purple-600 text-white px-6 py-3 rounded-xl font-bold">Ana səhifəyə qayıt</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
