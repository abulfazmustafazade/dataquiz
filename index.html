<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuizLive! - İnteraktiv Təlim Quiz Platforması</title>
  <meta name="description" content="Real vaxt rejimində Kahoot tipli interaktiv quiz platforması" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E" />
  <style>
    /* Splash screen — visible until React mounts */
    #splash {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-content { text-align: center; color: white; font-family: system-ui, -apple-system, sans-serif; }
    .splash-logo {
      width: 96px; height: 96px;
      background: white; border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: splashPulse 1.6s ease-in-out infinite;
    }
    .splash-logo svg { width: 56px; height: 56px; color: #7c3aed; }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.05) rotate(3deg); }
    }
    .splash-title { font-size: 3rem; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.02em; }
    .splash-tagline { font-size: 1rem; opacity: 0.85; margin: 0 0 24px; }
    .splash-loader {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" />
        </svg>
      </div>
      <h1 class="splash-title">QuizLive!</h1>
      <p class="splash-tagline">İnteraktiv quiz platforması</p>
      <div class="splash-loader"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
  <script>
    // Hide splash once React has mounted (signal from main.jsx)
    window.addEventListener('app-ready', () => {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(() => splash.remove(), 500);
      }
    });
  </script>
</body>
</html>
